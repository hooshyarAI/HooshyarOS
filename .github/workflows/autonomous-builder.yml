name: Autonomous Builder Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-autonomous-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile autonomous Python runtime
        run: python -m compileall -q Backend/AI_Runtime
      - name: Run autonomous builder tests
        run: python -m pytest Backend/AI_Runtime/tests/test_autonomous_builder_platform.py -q
