name: Clean targeted npm security remediation candidate

on:
  push:
    branches:
      - security/npm-remediation-clean-candidate-2026-10-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Apply bounded updates, audit and run full Jest suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      security_gate_pass: ${{ steps.evaluate.outputs.security_gate_pass }}
      tested_head_sha: ${{ steps.baseline.outputs.tested_head_sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout candidate base with read-only credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Capture baseline audit and target SHA
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "tested_head_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          cp package.json package-json-before.json
          cp package-lock.json package-lock-before.json
          set +e
          npm audit --json > npm-audit-before.json
          baseline_exit=$?
          set -e
          echo "BASELINE_NPM_AUDIT_EXIT_CODE=$baseline_exit"
          node -e "const r=require('./npm-audit-before.json'); if(!r.metadata?.vulnerabilities || !r.vulnerabilities) process.exit(2); console.log('BASELINE_AUDIT_COUNTS '+JSON.stringify(r.metadata.vulnerabilities))"

      - name: Apply exact-tested Jest 30 and scoped UUID override
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.devDependencies ||= {};
          p.devDependencies.jest = '30.5.2';
          p.devDependencies['ts-jest'] = '29.4.9';
          p.overrides ||= {};
          p.overrides['exceljs-hardened'] = {
            ...(p.overrides['exceljs-hardened'] || {}),
            uuid: '11.1.1'
          };
          // argparse 2.x retains the v1 compatibility API and removes its sprintf-js dependency.
          p.overrides.argparse = '2.0.1';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          set +e
          npm audit fix --ignore-scripts --no-fund > npm-audit-fix-output.txt 2>&1
          fix_exit=$?
          set -e
          echo "NPM_AUDIT_FIX_EXIT_CODE=$fix_exit"

      - name: Install exact lockfile and evaluate advisory gate
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ls uuid --all > npm-ls-uuid.txt
          set +e
          npm audit --json > npm-audit-after.json
          audit_exit=$?
          set -e
          echo "POST_REMEDIATION_NPM_AUDIT_EXIT_CODE=$audit_exit"
          node <<'NODE'
          const fs = require('node:fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const beforePkg = read('package-json-before.json');
          const afterPkg = read('package.json');
          const beforeLock = read('package-lock-before.json');
          const afterLock = read('package-lock.json');
          const before = read('npm-audit-before.json');
          const after = read('npm-audit-after.json');
          if (!before.metadata?.vulnerabilities || !after.metadata?.vulnerabilities) {
            throw new Error('Incomplete npm audit report.');
          }
          if (afterPkg.devDependencies?.jest !== '30.5.2' ||
              afterPkg.devDependencies?.['ts-jest'] !== '29.4.9') {
            throw new Error('Tested Jest/ts-jest versions were not preserved.');
          }
          if (afterPkg.overrides?.['exceljs-hardened']?.uuid !== '11.1.1') {
            throw new Error('Scoped uuid override was not preserved.');
          }
          if (afterLock.packages?.['node_modules/jest']?.version !== '30.5.2' ||
              afterLock.packages?.['node_modules/ts-jest']?.version !== '29.4.9') {
            throw new Error('The lockfile does not contain the tested Jest toolchain.');
          }
          if (afterLock.packages?.['node_modules/exceljs-hardened']?.version !== '5.0.0') {
            throw new Error('exceljs-hardened major/version must stay at 5.0.0.');
          }
          if (afterLock.packages?.['node_modules/uuid']?.version !== '11.1.1') {
            throw new Error('The resolved UUID was not updated to 11.1.1.');
          }
          if (afterPkg.overrides?.argparse !== '2.0.1' ||
              afterLock.packages?.['node_modules/argparse']?.version !== '2.0.1') {
            throw new Error('The argparse 2.0.1 compatibility override was not preserved.');
          }
          if (Object.keys(afterLock.packages || {}).some(path => path.endsWith('node_modules/sprintf-js'))) {
            throw new Error('sprintf-js still exists in the resolved dependency tree.');
          }
          const major = v => Number(/^\s*(\d+)/.exec(v || '')?.[1] || -1);
          const oldMammoth = beforeLock.packages?.['node_modules/mammoth']?.version;
          const newMammoth = afterLock.packages?.['node_modules/mammoth']?.version;
          if (!oldMammoth || major(oldMammoth) !== major(newMammoth)) {
            throw new Error('Mammoth major version must remain unchanged.');
          }
          const directChanges = [];
          for (const group of ['dependencies', 'devDependencies']) {
            const names = new Set([...Object.keys(beforePkg[group] || {}), ...Object.keys(afterPkg[group] || {})]);
            for (const name of names) {
              if (beforePkg[group]?.[name] !== afterPkg[group]?.[name]) {
                directChanges.push({group, name, before:beforePkg[group]?.[name], after:afterPkg[group]?.[name]});
              }
            }
          }
          const unexpected = directChanges.filter(x =>
            !(x.group === 'devDependencies' && ['jest', 'ts-jest'].includes(x.name))
          );
          const beforeV = before.vulnerabilities || {};
          const afterV = after.vulnerabilities || {};
          const resolved = Object.keys(beforeV).filter(n => !afterV[n]);
          const introduced = Object.keys(afterV).filter(n => !beforeV[n]);
          // Count advisory identities separately from affected package paths. A dependency-tree
          // reshuffle can introduce package-path rows for an advisory that already existed.
          const advisoryIds = report => new Set(Object.values(report.vulnerabilities || {}).flatMap(v =>
            (v.via || []).filter(x => typeof x === 'object').map(x => x.url || x.title).filter(Boolean)));
          const beforeAdvisoryIds = advisoryIds(before);
          const afterAdvisoryIds = advisoryIds(after);
          const introducedAdvisories = [...afterAdvisoryIds].filter(id => !beforeAdvisoryIds.has(id));
          const resolvedAdvisories = [...beforeAdvisoryIds].filter(id => !afterAdvisoryIds.has(id));
          const b = before.metadata.vulnerabilities;
          const a = after.metadata.vulnerabilities;
          const gate = a.total === 0 && a.critical === 0 && a.high === 0 &&
            introducedAdvisories.length === 0 && unexpected.length === 0 &&
            !afterV.uuid && !afterV['exceljs-hardened'] && !afterV.argparse && !afterV['sprintf-js'];
          const remainingRootAdvisories = Object.entries(afterV)
            .flatMap(([name, v]) => (v.via || [])
              .filter(x => typeof x === 'object')
              .map(x => ({package:name, severity:v.severity, title:x.title, url:x.url, range:x.range})));
          const summary = {
            auditBefore:b, auditAfter:a,
            resolvedPackageFindings:resolved,
            introducedPackageFindings:introduced,
            baselineUniqueAdvisories:[...beforeAdvisoryIds].sort(),
            remainingUniqueAdvisories:[...afterAdvisoryIds].sort(),
            resolvedAdvisories:resolvedAdvisories.sort(),
            introducedAdvisories:introducedAdvisories.sort(),
            unexpectedDirectDependencyChanges:unexpected,
            intentionalDirectDependencyChanges:directChanges.filter(x =>
              x.group === 'devDependencies' && ['jest', 'ts-jest'].includes(x.name)),
            uuidBefore:beforeLock.packages?.['node_modules/uuid']?.version,
            uuidAfter:afterLock.packages?.['node_modules/uuid']?.version,
            argparseBefore:beforeLock.packages?.['node_modules/argparse']?.version,
            argparseAfter:afterLock.packages?.['node_modules/argparse']?.version,
            sprintfJsRemaining:Object.keys(afterLock.packages || {}).filter(path => path.endsWith('node_modules/sprintf-js')),
            exceljsHardenedVersion:afterLock.packages?.['node_modules/exceljs-hardened']?.version,
            mammothBefore:oldMammoth, mammothAfter:newMammoth,
            remainingRootAdvisories,
            securityGatePass:gate
          };
          fs.writeFileSync('npm-remediation-summary.json', JSON.stringify(summary, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'security_gate_pass=' + String(gate) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Targeted npm remediation: ' + (gate ? 'SECURITY GATE PASS' : 'SECURITY GATE BLOCKED') + '\n\n' +
            '- Audit findings: ' + b.total + ' → ' + a.total + '\n' +
            '- argparse: ' + (beforeLock.packages?.['node_modules/argparse']?.version || 'missing') + ' → ' + (afterLock.packages?.['node_modules/argparse']?.version || 'missing') + '\n' +
            '- Critical: ' + b.critical + ' → ' + a.critical + '\n' +
            '- High: ' + b.high + ' → ' + a.high + '\n' +
            '- Moderate: ' + b.moderate + ' → ' + a.moderate + '\n' +
            '- Remaining explicit upstream advisory paths: ' + remainingRootAdvisories.length + '\n');
          console.log('NPM_REMEDIATION_COMPARISON ' + JSON.stringify(summary, null, 2));
          NODE

      - name: Run complete Jest suite
        id: tests
        run: |
          npm test -- --runInBand --ci
          echo "PASS: full Jest suite completed on the exact candidate lockfile." > TEST-PASSED.txt

      - name: Hash exact candidate manifests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then sha256sum package.json | cut -d' ' -f1 > package-json.sha256; fi
          if [[ -f package-lock.json ]]; then sha256sum package-lock.json | cut -d' ' -f1 > package-lock.sha256; fi

      - name: Upload audit, test and lockfile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hooshyar-clean-npm-remediation-candidate
          path: |
            package.json
            package-lock.json
            package-json.sha256
            package-lock.sha256
            package-json-before.json
            package-lock-before.json
            npm-audit-before.json
            npm-audit-after.json
            npm-remediation-summary.json
            npm-audit-fix-output.txt
            npm-ls-uuid.txt
            TEST-PASSED.txt
          if-no-files-found: warn
          retention-days: 14

  commit-tested-candidate:
    name: Commit only the exact tested package manifests
    needs: candidate
    if: needs.candidate.result == 'success' && needs.candidate.outputs.security_gate_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the same candidate branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download exact tested evidence
        uses: actions/download-artifact@v4
        with:
          name: hooshyar-clean-npm-remediation-candidate
          path: candidate-artifact

      - name: Verify hashes, tested source head and exact commit scope
        shell: bash
        env:
          EXPECTED_TESTED_HEAD_SHA: ${{ needs.candidate.outputs.tested_head_sha }}
        run: |
          set -euo pipefail
          test -f candidate-artifact/TEST-PASSED.txt
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TESTED_HEAD_SHA" ]]
          [[ "$(cat candidate-artifact/package-json.sha256)" == "$(sha256sum candidate-artifact/package.json | cut -d' ' -f1)" ]]
          [[ "$(cat candidate-artifact/package-lock.sha256)" == "$(sha256sum candidate-artifact/package-lock.json | cut -d' ' -f1)" ]]
          cp candidate-artifact/package.json package.json
          cp candidate-artifact/package-lock.json package-lock.json
          git diff --check
          mapfile -t changed_files < <(git diff --name-only | sort)
          [[ "${changed_files[*]}" == "package-lock.json package.json" ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply tested npm dependency remediation"
          git push origin "HEAD:$GITHUB_REF_NAME"
