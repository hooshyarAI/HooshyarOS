name: Android Release Verification

on:
  pull_request:
    paths:
      - 'android/**'
      - 'web/**'
      - 'Backend/HBOS/Autonomous/Runtime/CommercialRuntimeServer.ts'
      - 'Docs/Product/PRODUCT_PLATFORM_MANIFEST.json'
      - 'Docs/Product/PRODUCT_QUALIFICATION_MATRIX.json'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - 'Backend/HBOS/Autonomous/Runtime/CommercialRuntimeServer.ts'
      - 'Docs/Product/PRODUCT_PLATFORM_MANIFEST.json'
      - 'Docs/Product/PRODUCT_QUALIFICATION_MATRIX.json'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Android emulator install and launch smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n ai.hooshyar.client/.MainActivity
            adb logcat -d AndroidRuntime:E *:S | tail -n 50 || true
            adb shell dumpsys activity activities | grep -i hooshyar || true
            adb shell pidof ai.hooshyar.client
            adb shell dumpsys activity activities | grep -q 'ai.hooshyar.client/.MainActivity'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hooshyar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
