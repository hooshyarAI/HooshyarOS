name: HooshyarOS Team Dispatch Authority

on:
  workflow_call:
    inputs:
      reason:
        description: "Reason for the governed Team Worker dispatch"
        required: true
        type: string
      acceptance_authorization_id:
        description: "Optional one-shot Team V2 Acceptance Authorization ID"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  authorize-and-dispatch:
    runs-on: ubuntu-slim
    concurrency:
      group: hooshyaros-team-dispatch-authority
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: "fix/autonomous-product-factory"
      TEAM_WORKER_WORKFLOW_ID: "378094136"
      TEAM_CONTROL_ISSUE: "122"
      TEAM_DISPATCH_REASON: ${{ inputs.reason }}
      TEAM_ACCEPTANCE_AUTHORIZATION_ID: ${{ inputs.acceptance_authorization_id }}
      TEAM_AUTHORIZATION_SIGNING_SECRET: ${{ secrets.TEAM_AUTHORIZATION_SIGNING_SECRET }}
    steps:
      - name: Checkout control-plane authority
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Verify deterministic admission policy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/team-v2-dispatch-authority.test.cjs

      - name: Execute single authoritative admission and dispatch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/team-v2-dispatch-authority.cjs
