name: HooshyarOS Canonical Release Gate
run-name: HooshyarOS Release Gate • ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [agent/release-final]
  pull_request:
    branches: [stable/aprvl-controlled-repair-2026-08-15]
concurrency:
  group: hooshyaros-canonical-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm test -- --runInBand Backend/HBOS/Product/RuntimeValidationContract.test.ts Backend/HBOS/Product/RuntimeValidationEvidence.test.ts Backend/HBOS/Product/WindowsRuntimeProbe.test.ts Backend/HBOS/test/AutonomousProductizationRouting.test.ts Backend/HBOS/test/WindowsProductInstallerContract.test.ts
  windows-release:
    needs: runtime-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - run: python Backend/AI_Runtime/final_windows_installer_builder.py
      - shell: pwsh
        run: |
          $a='dist/productization/windows/HooshyarOS-Setup.exe'
          if (!(Test-Path $a)) { throw "Windows installer missing: $a" }
          if ((Get-Item $a).Length -lt 100KB) { throw 'Windows installer unexpectedly small' }
      - uses: actions/upload-artifact@v4
        with: {name: HooshyarOS-Windows-Installer, path: dist/productization/windows/HooshyarOS-Setup.exe, if-no-files-found: error, retention-days: 30}
  windows-install-launch-uninstall:
    needs: windows-release
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with: {name: HooshyarOS-Windows-Installer, path: dist/productization/windows}
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=(Resolve-Path 'dist/productization/windows/HooshyarOS-Setup.exe').Path
          $root=Join-Path $env:ProgramData 'HooshyarOS'
          $marker=Join-Path $root 'HooshyarOS-install-complete.marker'
          $log=Join-Path $env:ProgramData 'HooshyarOS-install.log'
          $externalUninstaller=Join-Path $env:ProgramData 'HooshyarOS-uninstall.ps1'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path $externalUninstaller) { Remove-Item $externalUninstaller -Force -ErrorAction SilentlyContinue }
          if (Test-Path $log) { Remove-Item $log -Force -ErrorAction SilentlyContinue }
          $p=Start-Process $installer -ArgumentList '/Q' -PassThru
          $deadline=(Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $marker) { break }
            $p.Refresh(); if ($p.HasExited) { break }; Start-Sleep 1
          }
          if (!(Test-Path $marker)) {
            if (Test-Path $log) { Get-Content $log | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
            if (!$p.HasExited) { try { taskkill.exe /PID $p.Id /T /F | Out-Host } catch {} }
            throw 'Installer did not complete within 180 seconds'
          }
      - shell: pwsh
        run: |
          $root=Join-Path $env:ProgramData 'HooshyarOS'; $runtime=Join-Path $root 'runtime'
          foreach ($p in @($root,(Join-Path $root 'HooshyarOS-install-complete.marker'),$runtime,(Join-Path $runtime 'commercial-runtime.js'),(Join-Path $runtime 'start-hooshyar.cmd'))) { if (!(Test-Path $p)) { throw "Missing: $p" } }
          if (!(Test-Path (Join-Path $env:ProgramData 'HooshyarOS-uninstall.ps1'))) { throw 'External uninstaller missing' }
      - shell: pwsh
        run: |
          $runtime=Join-Path $env:ProgramData 'HooshyarOS\runtime\commercial-runtime.js'
          $p=Start-Process node.exe -ArgumentList @($runtime,'--health-check') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Health check failed: $($p.ExitCode)" }
      - if: always()
        shell: pwsh
        run: |
          $u=Join-Path $env:ProgramData 'HooshyarOS-uninstall.ps1'
          if (Test-Path $u) { powershell.exe -NoProfile -ExecutionPolicy Bypass -File $u }
          Start-Sleep 2
          if (Test-Path (Join-Path $env:ProgramData 'HooshyarOS')) { throw 'Uninstall cleanup failed' }
          if (Test-Path $u) { Remove-Item $u -Force -ErrorAction SilentlyContinue }
  android-release:
    needs: runtime-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path android | Out-Null
          @('android.useAndroidX=true','android.enableJetifier=true','org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8') | Set-Content -Encoding UTF8 android/gradle.properties
          New-Item -ItemType Directory -Force -Path "$env:GRADLE_USER_HOME\init.d" | Out-Null
          @'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.dependencySubstitution {
                substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
              }
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            }
          }
          '@ | Set-Content -Encoding UTF8 "$env:GRADLE_USER_HOME\init.d\hooshyaros-kotlin.gradle"
      - run: python Backend/AI_Runtime/productization_builder.py --platform ANDROID
      - shell: pwsh
        run: |
          $a='dist/productization/android/HooshyarOS.apk'
          if (!(Test-Path $a)) { throw "Android APK missing: $a" }
          if ((Get-Item $a).Length -lt 100KB) { throw 'Android APK unexpectedly small' }
      - uses: actions/upload-artifact@v4
        with: {name: HooshyarOS-Android-APK-Emulator-Test, path: dist/productization/android/HooshyarOS.apk, if-no-files-found: error, retention-days: 30}
  release-evidence:
    if: ${{ always() }}
    needs: [runtime-contract, windows-release, windows-install-launch-uninstall, android-release]
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $r=@{runtime='${{ needs.runtime-contract.result }}';windows='${{ needs.windows-release.result }}';install='${{ needs.windows-install-launch-uninstall.result }}';android='${{ needs.android-release.result }}'}
          $r | ConvertTo-Json | Out-File release-evidence.json -Encoding utf8
          if ($r.Values -contains 'failure' -or $r.Values -contains 'cancelled' -or $r.Values -contains 'skipped') { throw 'Canonical release gate failed or is inconclusive' }
      - uses: actions/upload-artifact@v4
        with: {name: HooshyarOS-Release-Evidence, path: release-evidence.json, if-no-files-found: error, retention-days: 30}
