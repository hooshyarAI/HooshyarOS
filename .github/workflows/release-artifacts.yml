name: HooshyarOS Release Artifacts

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/release-readiness
  push:
    branches:
      - agent/release-readiness

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Verify runtime validation contract
        run: npm test -- --runInBand Backend/HBOS/Product/RuntimeValidationContract.test.ts Backend/HBOS/test/AutonomousProductizationRouting.test.ts Backend/HBOS/test/WindowsProductInstallerContract.test.ts

  windows-release:
    needs: runtime-contract
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build Windows release artifact
        env:
          HOOSHYAR_REQUIRE_REAL_WINDOWS_EXE: "1"
        run: python Backend/AI_Runtime/productization_builder.py --platform WINDOWS
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifact = "dist/productization/windows/HooshyarOS-Setup.exe"
          if (!(Test-Path $artifact)) { throw "Windows installer artifact missing: $artifact" }
          if ((Get-Item $artifact).Length -lt 100KB) { throw "Windows installer artifact is unexpectedly small" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HooshyarOS-Windows-Installer
          path: dist/productization/windows/HooshyarOS-Setup.exe
          if-no-files-found: error

  windows-install-probe:
    needs: windows-release
    runs-on: windows-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: HooshyarOS-Windows-Installer
          path: dist/productization/windows
      - name: Install Windows product
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "dist/productization/windows/HooshyarOS-Setup.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList "/Q" -Wait -PassThru -NoNewWindow
          "InstallerExitCode=$($process.ExitCode)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($process.ExitCode -ne 0) { throw "Windows installer exited with code $($process.ExitCode)" }
      - name: Verify installed runtime and launch surface
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:ProgramData "HooshyarOS"
          if (!(Test-Path $root)) { throw "Install root missing: $root" }
          $launcher = Join-Path $root "runtime\start-hooshyar.cmd"
          if (!(Test-Path $launcher)) { throw "Launch surface missing: $launcher" }
          Write-Host "Windows install root verified: $root"
          Write-Host "Windows launch surface verified: $launcher"
      - name: Uninstall Windows product
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $uninstaller = Join-Path $env:ProgramData "HooshyarOS\runtime\uninstall.ps1"
          if (Test-Path $uninstaller) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $uninstaller
            if ($LASTEXITCODE -ne 0) { Write-Warning "Uninstaller exited with code $LASTEXITCODE" }
          }

  android-release:
    needs: runtime-contract
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      HOOSHYAR_ENDPOINT: "http://10.0.2.2:3000"
      GRADLE_USER_HOME: "${{ github.workspace }}\\.gradle-governed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce Android build properties
        shell: pwsh
        run: |
          @(
            "android.useAndroidX=true",
            "android.enableJetifier=true",
            "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
          ) | Set-Content -Encoding UTF8 android/gradle.properties
      - name: Setup Android test artifact endpoint
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HOOSHYAR_ENDPOINT)) { throw "Android test endpoint is required" }
      - name: Govern Android Kotlin dependency resolution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GRADLE_USER_HOME\\init.d" | Out-Null
          @'
          allprojects {
            configurations.configureEach {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
            }
          }
          '@ | Set-Content -Encoding UTF8 "$env:GRADLE_USER_HOME\\init.d\\hooshyaros-kotlin.gradle"
      - name: Verify governed Kotlin policy is present
        shell: pwsh
        run: |
          $policy = "$env:GRADLE_USER_HOME\\init.d\\hooshyaros-kotlin.gradle"
          if (!(Test-Path $policy)) { throw "Governed Kotlin policy missing" }
          $text = Get-Content $policy -Raw
          foreach ($required in @("kotlin-stdlib-jdk7", "kotlin-stdlib-jdk8", "kotlin-stdlib:1.8.22")) {
            if ($text -notmatch [regex]::Escape($required)) { throw "Kotlin policy missing: $required" }
          }
      - name: Build Android test artifact
        run: python Backend/AI_Runtime/productization_builder.py --platform ANDROID
      - name: Verify Android APK
        shell: pwsh
        run: |
          $artifact = "dist/productization/android/HooshyarOS.apk"
          if (!(Test-Path $artifact)) { throw "Android APK artifact missing: $artifact" }
          if ((Get-Item $artifact).Length -lt 100KB) { throw "Android APK artifact is unexpectedly small" }
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: HooshyarOS-Android-APK-Emulator-Test
          path: dist/productization/android/HooshyarOS.apk
          if-no-files-found: error
