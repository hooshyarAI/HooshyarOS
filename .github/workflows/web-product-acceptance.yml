name: Web Product Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Run executable web acceptance
        run: npm run product:web:acceptance
