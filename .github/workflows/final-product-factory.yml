name: Final Product Factory

permissions:
  contents: read
  actions: read

on:
  pull_request:
    branches: [main, fix/autonomous-product-factory, fix/qualification-runner-fail-closed]
  workflow_dispatch:
    inputs:
      agent_repair_run_id:
        description: "Trusted, active opt-in repair workflow run ID for evidence-bound requalification."
        type: string
        required: false
        default: ""
      expected_head_sha:
        description: "Exact target branch SHA to qualify during opt-in requalification."
        type: string
        required: false
        default: ""

concurrency:
  group: hooshyaros-final-product-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-product-factory:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - name: Run executable Windows product factory
        id: product-factory
        continue-on-error: true
        run: npm run product:factory
        env:
          HOOSHYAR_FACTORY_ALLOW_PUSH: "0"
      - name: Validate factory evidence exists
        run: |
          if (-not (Test-Path .hooshyar/factory-success.json)) {
            Write-Host "Missing factory evidence: .hooshyar/factory-success.json"
            exit 1
          }
      - name: Emit assistant repair handoff on failure
        if: steps.product-factory.outcome == 'failure'
        run: npm run product:factory:handoff
      - name: Stage canonical factory evidence for artifact upload
        if: always()
        run: |
          if (-not (Test-Path .hooshyar/factory-success.json)) {
            Write-Host "Missing factory evidence: .hooshyar/factory-success.json"
            exit 1
          }
          Copy-Item .hooshyar/factory-success.json ./factory-success.json -Force
      - name: Upload product factory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-final-product-factory-evidence
          path: ./factory-success.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail release gate on factory failure
        if: steps.product-factory.outcome == 'failure'
        run: exit 1

  web-product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - name: Run executable Web product acceptance
        run: npm run product:web:acceptance
      - name: Upload web acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-web-product-acceptance-evidence
          path: ./.hooshyar/web-acceptance-success.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  security-tenant-acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - name: Run executable security and tenant isolation acceptance
        run: npm run product:security:acceptance
      - name: Upload security acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-security-tenant-evidence
          path: ./.hooshyar/security-acceptance-success.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  android-product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Install and launch Android application
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android-product-acceptance.sh
      - name: Verify harness-produced Android acceptance evidence
        shell: bash
        run: node scripts/android-acceptance-evidence.cjs verify
      - name: Upload Android acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-android-product-acceptance-evidence
          path: ./.hooshyar/android-acceptance-success.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable Android APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  full-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [windows-product-factory, web-product-acceptance, security-tenant-acceptance, android-product-acceptance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - name: Full Jest
        run: npm test -- --runInBand
      - name: Scoped TypeScript type check (canonical factory runner; TS suites checked by Jest)
        run: node ./node_modules/typescript/bin/tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --types node Backend/HBOS/Autonomous/Product/FinalProductFactoryRunner.ts
      - name: Emit current-commit full-suite evidence
        run: node scripts/full-suite-evidence.cjs
        env:
          SECURITY_TENANT_ACCEPTANCE_RESULT: ${{ needs.security-tenant-acceptance.result }}
      - name: Upload full-suite qualification evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-full-suite-evidence
          path: ./.hooshyar/full-suite-success.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  runtime-evidence-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ always() }}
    needs: [windows-product-factory, web-product-acceptance, security-tenant-acceptance, android-product-acceptance, full-qualification]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download Windows factory evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hooshyar-final-product-factory-evidence
          path: ./.hooshyar
          merge-multiple: true
      - name: Download Web acceptance evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hooshyar-web-product-acceptance-evidence
          path: ./.hooshyar
          merge-multiple: true
      - name: Download Android acceptance evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hooshyar-android-product-acceptance-evidence
          path: ./.hooshyar
          merge-multiple: true
      - name: Download security acceptance evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hooshyar-security-tenant-evidence
          path: ./.hooshyar
          merge-multiple: true
      - name: Download full-suite qualification evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hooshyar-full-suite-evidence
          path: ./.hooshyar
          merge-multiple: true
      - name: Report canonical evidence paths without masking blockers
        shell: bash
        run: |
          for evidence in factory-success.json web-acceptance-success.json android-acceptance-success.json security-acceptance-success.json; do
            if test -f ".hooshyar/$evidence"; then
              echo "EVIDENCE_PRESENT=$evidence"
            else
              echo "EVIDENCE_MISSING=$evidence"
            fi
          done
      - name: Download current-commit autonomous repair evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
          REPAIR_RUN_ID: ${{ inputs.agent_repair_run_id || '' }}
          HOOSHYAR_EXPECTED_REPAIR_RUN_ID: ${{ inputs.agent_repair_run_id || '' }}
        run: |
          set -euo pipefail
          mkdir -p .hooshyar /tmp/hooshyar-repair-evidence
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_HEAD_SHA" ] && [ "$ACTUAL_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "AGENT_REPAIR_ARTIFACT=BLOCKED_TARGET_SHA_CHANGED expected=$EXPECTED_HEAD_SHA actual=$ACTUAL_SHA"
            exit 1
          fi
          OPTIN_URL="https://api.github.com/repos/${REPO}/actions/workflows/autonomous-ci-repair-optin.yml/runs?per_page=100"
          LEGACY_URL="https://api.github.com/repos/${REPO}/actions/workflows/autonomous-ci-repair.yml/runs?branch=${BRANCH}&per_page=30"
          if [ -n "$REPAIR_RUN_ID" ]; then
            RUN_INFO_URL="https://api.github.com/repos/${REPO}/actions/runs/${REPAIR_RUN_ID}"
            if ! curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "$RUN_INFO_URL" -o /tmp/hooshyar-repair-run.json; then
              echo "AGENT_REPAIR_ARTIFACT=BLOCKED_RUN_LOOKUP_FAILED"
              exit 1
            fi
            node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/hooshyar-repair-run.json","utf8"));const ok=r.path===".github/workflows/autonomous-ci-repair-optin.yml"&&r.event==="workflow_dispatch"&&r.head_branch==="main"&&r.status==="in_progress"&&r.head_repository?.full_name===process.env.REPO;if(!ok){console.error("OPT_IN_REPAIR_RUN_NOT_TRUSTED_OR_ACTIVE");process.exit(2)}'
            RUN_IDS="${REPAIR_RUN_ID}"
          else
            OPTIN_RUN_IDS=""
            LEGACY_RUN_IDS=""
            if curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "${OPTIN_URL}" -o /tmp/hooshyar-optin-runs.json; then
              OPTIN_RUN_IDS=$(jq -r '.workflow_runs[]?.id' /tmp/hooshyar-optin-runs.json)
            else
              echo "OPT_IN_REPAIR_RUN_DISCOVERY=UNAVAILABLE"
            fi
            if curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "${LEGACY_URL}" -o /tmp/hooshyar-legacy-runs.json; then
              LEGACY_RUN_IDS=$(jq -r '.workflow_runs[]?.id' /tmp/hooshyar-legacy-runs.json)
            else
              echo "LEGACY_REPAIR_RUN_DISCOVERY=UNAVAILABLE"
            fi
            RUN_IDS=$(printf '%s\n%s\n' "${OPTIN_RUN_IDS}" "${LEGACY_RUN_IDS}" | awk 'NF && !seen[$0]++')
          fi
          for RUN_ID in ${RUN_IDS}; do
            RUN_INFO_URL="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}"
            if ! curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "${RUN_INFO_URL}" -o /tmp/hooshyar-repair-run.json; then continue; fi
            RUN_PATH=$(jq -r '.path // ""' /tmp/hooshyar-repair-run.json)
            RUN_BRANCH=$(jq -r '.head_branch // ""' /tmp/hooshyar-repair-run.json)
            RUN_EVENT=$(jq -r '.event // ""' /tmp/hooshyar-repair-run.json)
            RUN_STATUS=$(jq -r '.status // ""' /tmp/hooshyar-repair-run.json)
            RUN_CONCLUSION=$(jq -r '.conclusion // ""' /tmp/hooshyar-repair-run.json)
            if [ "${RUN_PATH}" = ".github/workflows/autonomous-ci-repair-optin.yml" ]; then
              if [ "${RUN_BRANCH}" != "main" ] || [ "${RUN_EVENT}" != "workflow_dispatch" ] ||
                 { [ "${RUN_STATUS}" != "in_progress" ] && { [ "${RUN_STATUS}" != "completed" ] || [ "${RUN_CONCLUSION}" != "success" ]; }; }; then
                continue
              fi
              JOBS_URL="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100"
              if ! curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "${JOBS_URL}" -o /tmp/hooshyar-optin-jobs.json; then continue; fi
              REPAIR_JOB_CONCLUSION=$(jq -r '.jobs[]? | select(.name=="repair-drill") | .conclusion // ""' /tmp/hooshyar-optin-jobs.json | head -n 1)
              if [ "${REPAIR_JOB_CONCLUSION}" != "success" ]; then
                if [ -n "$REPAIR_RUN_ID" ]; then echo "OPT_IN_REPAIR_DRILL_JOB_NOT_SUCCESS"; exit 1; else continue; fi
              fi
            elif [ "${RUN_PATH}" = ".github/workflows/autonomous-ci-repair.yml" ]; then
              if [ "${RUN_BRANCH}" != "${BRANCH}" ] ||
                 { [ "${RUN_STATUS}" != "in_progress" ] && { [ "${RUN_STATUS}" != "completed" ] || [ "${RUN_CONCLUSION}" != "success" ]; }; }; then
                continue
              fi
            else
              continue
            fi

            ARTIFACTS_URL="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts"
            if ! curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "${ARTIFACTS_URL}" -o /tmp/hooshyar-repair-artifacts.json; then continue; fi
            ARTIFACT_ID=$(jq -r '.artifacts[]? | select(.name=="hooshyar-agent-repair-evidence" and .expired==false) | .id' /tmp/hooshyar-repair-artifacts.json | head -n 1)
            if [ -z "${ARTIFACT_ID}" ]; then continue; fi
            ZIP="/tmp/hooshyar-repair-evidence/${RUN_ID}.zip"
            if ! curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" -o "${ZIP}"; then continue; fi
            mkdir -p "/tmp/hooshyar-repair-evidence/${RUN_ID}"
            if ! unzip -oq "${ZIP}" -d "/tmp/hooshyar-repair-evidence/${RUN_ID}"; then continue; fi
            SOURCE="/tmp/hooshyar-repair-evidence/${RUN_ID}/agent-repair-success.json"
            if [ ! -f "${SOURCE}" ]; then continue; fi
            cp "${SOURCE}" .hooshyar/agent-repair-success.json
            if node scripts/agent-repair-evidence-check.cjs; then
              echo "AGENT_REPAIR_ARTIFACT=ACCEPTED run=${RUN_ID} artifact=${ARTIFACT_ID} commit=${HEAD_SHA}"
              exit 0
            fi
            rm -f .hooshyar/agent-repair-success.json
          done
          echo "AGENT_REPAIR_ARTIFACT=BLOCKED_NO_MATCHING_CURRENT_COMMIT_ARTIFACT"

      - name: Run Cline runtime evidence collector
        if: always()
        env:
          HOOSHYAR_EXPECTED_REPAIR_RUN_ID: ${{ inputs.agent_repair_run_id || '' }}
        run: node scripts/cline-runtime-evidence-collector.cjs
      - name: Enforce canonical product qualification matrix
        run: node scripts/real-product-qualification.cjs --matrix-only

      - name: Upload consolidated qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-cline-runtime-evidence
          path: ./.hooshyar/cline-runtime-evidence.json
          include-hidden-files: true
          retention-days: 14

  release-gate:
    runs-on: ubuntu-latest
    needs: [windows-product-factory, web-product-acceptance, security-tenant-acceptance, android-product-acceptance, full-qualification, runtime-evidence-qualification]
    if: ${{ always() }}
    steps:
      - name: Require every release gate to pass
        shell: bash
        run: |
          test "${{ needs.windows-product-factory.result }}" = "success"
          test "${{ needs.web-product-acceptance.result }}" = "success"
          test "${{ needs.security-tenant-acceptance.result }}" = "success"
          test "${{ needs.android-product-acceptance.result }}" = "success"
          test "${{ needs.full-qualification.result }}" = "success"
          test "${{ needs.runtime-evidence-qualification.result }}" = "success"
          echo "FINAL_PRODUCT_RELEASE_GATE=PASS"
