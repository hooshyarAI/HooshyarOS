name: Final Product Factory

permissions:
  contents: read
  actions: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hooshyaros-final-product-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-product-factory:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - name: Run executable Windows product factory
        id: product-factory
        continue-on-error: true
        run: npm run product:factory
        env:
          HOOSHYAR_FACTORY_ALLOW_PUSH: "0"
      - name: Validate factory evidence exists
        run: |
          if (-not (Test-Path .hooshyar/factory-success.json)) {
            Write-Host "Missing factory evidence: .hooshyar/factory-success.json"
            exit 1
          }
      - name: Emit assistant repair handoff on failure
        if: steps.product-factory.outcome == 'failure'
        run: npm run product:factory:handoff
      - name: Stage canonical factory evidence for artifact upload
        if: always()
        run: |
          if (-not (Test-Path .hooshyar/factory-success.json)) {
            Write-Host "Missing factory evidence: .hooshyar/factory-success.json"
            exit 1
          }
          Copy-Item .hooshyar/factory-success.json ./factory-success.json -Force
      - name: Upload product factory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-final-product-factory-evidence
          path: ./factory-success.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail release gate on factory failure
        if: steps.product-factory.outcome == 'failure'
        run: exit 1

  web-product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - name: Run executable Web product acceptance
        run: npm run product:web:acceptance
      - name: Upload web acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-web-product-acceptance-evidence
          path: ./.hooshyar/web-acceptance-success.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  security-tenant-acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - name: Run executable security and tenant isolation acceptance
        run: npm run product:security:acceptance
      - name: Upload security acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-security-tenant-evidence
          path: ./.hooshyar/security-acceptance-success.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  android-product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Install and launch Android application
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android-product-acceptance.sh
      - name: Verify harness-produced Android acceptance evidence
        shell: bash
        run: node scripts/android-acceptance-evidence.cjs verify
      - name: Upload Android acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-android-product-acceptance-evidence
          path: ./.hooshyar/android-acceptance-success.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable Android APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  full-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [windows-product-factory, web-product-acceptance, security-tenant-acceptance, android-product-acceptance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate canonical product assurance contract
        run: npm run product:assurance
      - name: Full Jest
        run: npm test -- --runInBand

  runtime-evidence-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ always() }}
    needs: [windows-product-factory, web-product-acceptance, security-tenant-acceptance, android-product-acceptance, full-qualification]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download Windows factory evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hooshyar-final-product-factory-evidence
          path: ./.hooshyar
          merge-multiple: true
      - name: Download Web acceptance evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hooshyar-web-product-acceptance-evidence
          path: ./.hooshyar
          merge-multiple: true
      - name: Download Android acceptance evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hooshyar-android-product-acceptance-evidence
          path: ./.hooshyar
          merge-multiple: true
      - name: Download security acceptance evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hooshyar-security-tenant-evidence
          path: ./.hooshyar
          merge-multiple: true
      - name: Report canonical evidence paths without masking blockers
        shell: bash
        run: |
          for evidence in factory-success.json web-acceptance-success.json android-acceptance-success.json security-acceptance-success.json; do
            if test -f ".hooshyar/$evidence"; then
              echo "EVIDENCE_PRESENT=$evidence"
            else
              echo "EVIDENCE_MISSING=$evidence"
            fi
          done
      - name: Download current-commit autonomous repair evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -u
          mkdir -p .hooshyar /tmp/hooshyar-repair-evidence
          RUNS_URL="https://api.github.com/repos/${REPO}/actions/workflows/autonomous-ci-repair.yml/runs?branch=${BRANCH}&per_page=30"
          if ! curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "${RUNS_URL}" -o /tmp/hooshyar-repair-runs.json; then
            echo "AGENT_REPAIR_ARTIFACT_LOOKUP=BLOCKED_API_UNAVAILABLE"
            exit 0
          fi
          RUN_IDS=$(jq -r '.workflow_runs[]?.id' /tmp/hooshyar-repair-runs.json)
          for RUN_ID in ${RUN_IDS}; do
            ARTIFACTS_URL="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts"
            if ! curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "${ARTIFACTS_URL}" -o /tmp/hooshyar-repair-artifacts.json; then continue; fi
            ARTIFACT_ID=$(jq -r '.artifacts[]? | select(.name=="hooshyar-agent-repair-evidence" and .expired==false) | .id' /tmp/hooshyar-repair-artifacts.json | head -n 1)
            if [ -z "${ARTIFACT_ID}" ]; then continue; fi
            ZIP="/tmp/hooshyar-repair-evidence/${RUN_ID}.zip"
            if ! curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" -o "${ZIP}"; then continue; fi
            mkdir -p "/tmp/hooshyar-repair-evidence/${RUN_ID}"
            if ! unzip -oq "${ZIP}" -d "/tmp/hooshyar-repair-evidence/${RUN_ID}"; then continue; fi
            SOURCE="/tmp/hooshyar-repair-evidence/${RUN_ID}/agent-repair-success.json"
            if [ ! -f "${SOURCE}" ]; then continue; fi
            cp "${SOURCE}" .hooshyar/agent-repair-success.json
            if node scripts/agent-repair-evidence-check.cjs; then
              echo "AGENT_REPAIR_ARTIFACT=ACCEPTED run=${RUN_ID} artifact=${ARTIFACT_ID} commit=${HEAD_SHA}"
              exit 0
            fi
            rm -f .hooshyar/agent-repair-success.json
          done
          echo "AGENT_REPAIR_ARTIFACT=BLOCKED_NO_MATCHING_CURRENT_COMMIT_ARTIFACT"

      - name: Run Cline runtime evidence collector
        if: always()
        run: node scripts/cline-runtime-evidence-collector.cjs
      - name: Enforce canonical product qualification matrix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const matrix = JSON.parse(fs.readFileSync('Docs/Product/PRODUCT_QUALIFICATION_MATRIX.json', 'utf8'));
          const evidence = JSON.parse(fs.readFileSync('.hooshyar/cline-runtime-evidence.json', 'utf8'));
          const commit = cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const cells = Array.isArray(evidence.cells) ? evidence.cells : [];
          const byId = new Map(cells.map(cell => [cell && cell.id, cell]));
          const blockers = matrix.required.filter(required => {
            const cell = byId.get(required.id);
            return !cell || cell.status !== 'PASS' || cell.commitSha !== commit ||
              cell.capability !== required.capability || cell.environment !== required.environment ||
              cell.workflow !== required.workflow || cell.evidenceKind !== required.evidence ||
              typeof cell.target !== 'string' || !cell.target.trim() ||
              typeof cell.evidenceRef !== 'string' || !cell.evidenceRef.trim();
          }).map(cell => cell.id);
          const decision = { status: blockers.length === 0 && evidence.commitSha === commit ? 'PASS' : 'BLOCKED', commit, blockers };
          console.log(JSON.stringify({ type: 'PRODUCT_QUALIFICATION_MATRIX', ...decision }, null, 2));
          if (decision.status !== 'PASS') process.exit(2);
          NODE
      - name: Upload consolidated qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hooshyar-cline-runtime-evidence
          path: ./.hooshyar/cline-runtime-evidence.json
          include-hidden-files: true
          retention-days: 14

  release-gate:
    runs-on: ubuntu-latest
    needs: [windows-product-factory, web-product-acceptance, security-tenant-acceptance, android-product-acceptance, full-qualification, runtime-evidence-qualification]
    if: ${{ always() }}
    steps:
      - name: Require every release gate to pass
        shell: bash
        run: |
          test "${{ needs.windows-product-factory.result }}" = "success"
          test "${{ needs.web-product-acceptance.result }}" = "success"
          test "${{ needs.security-tenant-acceptance.result }}" = "success"
          test "${{ needs.android-product-acceptance.result }}" = "success"
          test "${{ needs.full-qualification.result }}" = "success"
          test "${{ needs.runtime-evidence-qualification.result }}" = "success"
          echo "FINAL_PRODUCT_RELEASE_GATE=PASS"
