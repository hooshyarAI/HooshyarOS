name: HooshyarOS Autonomous Continuation Validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hooshyaros-autonomous-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies reproducibly
        run: npm ci

      - name: Assert clean repository after dependency installation
        run: test -z "$(git status --porcelain)"

      - name: Verify autonomous runtime contracts
        run: |
          npx tsc Backend/HBOS/Autonomous/Runtime/LocalConstructionToolset.ts Backend/HBOS/Autonomous/Runtime/AutonomousBuildDaemon.ts Backend/HBOS/Autonomous/Runtime/AutonomousProjectMission.ts --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --pretty false
          python -m compileall -q Backend/AI_Runtime

      - name: Verify autonomous assistant contracts
        run: |
          npx jest --runInBand Backend/HBOS/test/AssistantCompletionGate.test.ts Backend/HBOS/test/AutonomousCompletionGate.test.ts Backend/HBOS/test/HooshyarAutonomousAssistant.test.ts Backend/HBOS/test/AutonomousPlatformWeaving.test.ts
