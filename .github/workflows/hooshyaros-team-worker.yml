name: HooshyarOS Autonomous Team Worker

on:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Maximum concurrent workers for this wave"
        required: false
        default: "1"
        type: string
      reason:
        description: "Reason for the team wave"
        required: false
        default: "manual controlled team wave"
        type: string

concurrency:
  group: hooshyaros-autonomous-construction
  # A governed active wave is never cancelled by a later dispatch. The external Dispatcher
  # and post-completion Continuation workflow enforce single-wave admission.
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    outputs:
      start_sha: ${{ steps.final_state.outputs.start_sha }}
      matrix: ${{ steps.pool.outputs.matrix }}
      max_parallel: ${{ steps.pool.outputs.max_parallel }}
      lease_ids: ${{ steps.pool.outputs.lease_ids }}
    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: fix/autonomous-product-factory
          fetch-depth: 0

      - name: Team Manager — Queue and Runner Governor
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/queue-candidates.txt"
          import json, os, subprocess

          raw=subprocess.check_output([
              "gh","api",
              "repos/hooshyarAI/HooshyarOS/actions/runs?per_page=100"
          ], text=True)
          runs=json.loads(raw)["workflow_runs"]

          legacy={
              "Final Product Factory",
              "Final Product Factory Trigger",
              "Autonomous CI Repair",
              "Autonomous Builder Audit",
              "Autonomous Builder Verification",
              "Autonomous Builder Validation",
              "HooshyarOS Validation",
              "HooshyarOS CI",
              "HooshyarOS Release Artifacts",
              "Android Release Verification",
              "Autonomous Platform Construction",
              "HooshyarOS Autonomous Continuation Validation",
          }
          current=os.environ["GITHUB_RUN_ID"]
          for r in runs:
              if str(r.get("id")) == current:
                  continue
              if r.get("name") not in legacy:
                  continue
              if r.get("status") not in {"queued","pending","in_progress","waiting","requested","action_required"}:
                  continue
              if r.get("head_branch") not in {"main","fix/autonomous-product-factory"}:
                  continue
              print(r["id"])
          PY

          count=0
          while read -r run_id; do
            test -n "${run_id}" || continue
            count=$((count+1))
            echo "QUEUE_GOVERNOR_CANCEL=${run_id}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 ||               gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1 || true
          done < "${RUNNER_TEMP}/queue-candidates.txt"

          echo "QUEUE_GOVERNOR_CANCEL_REQUESTS=${count}"
          echo "QUEUE_GOVERNOR_CURRENT_RUN=${GITHUB_RUN_ID}"
          echo "QUEUE_GOVERNOR_STATUS=EXECUTED"
          echo "QUEUE_GOVERNOR_SCOPE=.kilo/team/COMMANDS/TEAM-QUEUE-RUNNER-GOVERNOR.md"

      - name: Team Manager — Governed Plan Admission
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          target="fix/autonomous-product-factory"
          subprocess.check_call(["git","fetch","origin",target])
          base=subprocess.check_output(["git","rev-parse",f"origin/{target}"],text=True).strip()

          plan_path=Path(".kilo/team/NEXT-WAVE-PLAN.json")
          registry_path=Path(".kilo/team/memory/work-registry.json")
          plan=json.loads(plan_path.read_text(encoding="utf-8"))
          registry=json.loads(registry_path.read_text(encoding="utf-8"))

          if plan.get("wave_status") != "READY":
              raise SystemExit("BLOCKED: plan is not READY")

          leases=plan.get("leases",[])
          if not leases:
              raise SystemExit("BLOCKED: READY plan has no leases")
          protected=[
              ".github/", "Docs/ARCHITECTURE.md", "Docs/HOOSHYAROS_MASTER_CHARTER.md",
              "Docs/HOOSHYAROS_GOVERNANCE_CHARTER.md", "Assistant/SYSTEM_PROMPT.md",
              "package.json", "package-lock.json", ".env"
          ]
          satisfied_statuses={"COMPLETED","VERIFIED","PROMOTED","MEMORIZED","CLOSED"}

          def norm(p):
              p=str(p).strip().lstrip("./")
              if "*" in p: p=p.split("*",1)[0]
              return p.rstrip("/")

          def overlaps(a,b):
              aa,bb=norm(a),norm(b)
              return bool(aa) and bool(bb) and (aa==bb or aa.startswith(bb+"/") or bb.startswith(aa+"/"))

          registry_items=registry.get("items",[])
          registry_by_id={str(x.get("id")):x for x in registry_items}
          planned_ids=set()
          planned_scopes=[]
          for lease in leases:
              missing=[k for k in ("id","role","focus","owner","mode","write_scope") if not lease.get(k)]
              if missing: raise SystemExit(f"BLOCKED: lease {lease.get('id','unknown')} missing {missing}")
              lid=str(lease["id"])
              m=re.match(r"^work-([0-9]{4})(?:-|$)",lid)
              if not m: raise SystemExit(f"BLOCKED: invalid governed lease identity {lid}")
              work_id=f"WORK-{m.group(1)}"
              if work_id in planned_ids: raise SystemExit(f"BLOCKED: duplicate Work Registry identity in plan {work_id}")
              planned_ids.add(work_id)
              mode=str(lease["mode"]).upper()
              if mode not in {"AUDIT","IMPLEMENT","REVIEW","VERIFY"}: raise SystemExit(f"BLOCKED: invalid mode for {lid}")
              scope=[str(x) for x in lease["write_scope"]]
              if f".kilo/team/results/{lid}/" not in scope:
                  raise SystemExit(f"BLOCKED: lease {lid} missing its evidence root")
              for item in scope:
                  n=norm(item)
                  if any(n==p.rstrip("/") or n.startswith(p) for p in protected):
                      raise SystemExit(f"BLOCKED: lease {lid} touches protected path {item}")
              for dep in lease.get("dependencies",[]) or []:
                  d=str(dep)
                  if d.startswith("WORK-"):
                      dep_item=registry_by_id.get(d)
                      if not dep_item: raise SystemExit(f"BLOCKED: {lid} missing dependency record {d}")
                      dep_status=str(dep_item.get("status","")).upper()
                      if dep_status not in satisfied_statuses:
                          raise SystemExit(f"BLOCKED: {lid} dependency {d} not satisfied (status={dep_status})")
              existing=registry_by_id.get(work_id)
              if existing:
                  attempts=existing.get("execution_attempts",[]) or []
                  unresolved=[a for a in attempts if not bool(a.get("promoted")) and str(a.get("state","")).upper() not in {"SUPERSEDED","DUPLICATE","INVALID"}]
                  if unresolved:
                      raise SystemExit(f"BLOCKED: {lid} has unresolved prior execution attempts")
              for prev_id,prev_scope in planned_scopes:
                  if any(overlaps(a,b) for a in scope for b in prev_scope):
                      raise SystemExit(f"BLOCKED: write-scope overlap {lid} <-> {prev_id}")
              planned_scopes.append((lid,scope))

          items=registry.setdefault("items",[])
          by_id={str(x.get("id")):x for x in items}
          next_id=str(registry.get("next_id",""))
          admitted=[]

          for lease in plan.get("leases",[]):
              lid=str(lease.get("id",""))
              m=re.match(r"^work-([0-9]{4})(?:-|$)",lid)
              if not m:
                  raise SystemExit(f"BLOCKED: invalid governed lease identity {lid}")
              work_id=f"WORK-{m.group(1)}"

              existing=by_id.get(work_id)
              if existing:
                  status=str(existing.get("status","")).upper()
                  if status not in {"READY","ACTIVE","EXECUTING","VERIFYING","CHECKPOINTED","COMPLETED","VERIFIED","PROMOTED","MEMORIZED","CLOSED"}:
                      raise SystemExit(f"BLOCKED: existing {work_id} has invalid status {status}")
                  print(f"ADMISSION_EXISTING={work_id} status={status}")
                  continue

              if next_id != work_id:
                  raise SystemExit(
                      f"BLOCKED: undispatched lease {lid} requires next_id={work_id}, "
                      f"registry.next_id={next_id}"
                  )

              scope=[str(x) for x in (lease.get("write_scope") or [])]
              record={
                  "id": work_id,
                  "title": str(lease.get("title",lid)),
                  "status": "READY",
                  "mode": str(lease.get("mode","REVIEW")),
                  "priority": str(lease.get("priority","P1")),
                  "owner": str(lease.get("owner","UNKNOWN")),
                  "dependencies": [str(x) for x in (lease.get("dependencies") or [])],
                  "evidence_required": [str(x) for x in (lease.get("evidence_required") or [])],
                  "purpose": str(lease.get("purpose",lease.get("focus",""))),
                  "blockers": [],
                  "test_scope": str(lease.get("test_scope","GOVERNED_LEASE_VERIFICATION")),
                  "risk": str(lease.get("risk","P1")),
                  "value": str(lease.get("value","UNKNOWN_NOT_DERIVABLE_FROM_REPOSITORY")),
                  "readiness": "READY",
                  "estimated_complexity": str(lease.get("estimated_complexity","UNKNOWN_NOT_DERIVABLE_FROM_REPOSITORY")),
                  "write_scope": scope,
                  "admission": {
                      "source": "NEXT-WAVE-PLAN",
                      "lease_id": lid,
                      "run_id": int(os.environ["GITHUB_RUN_ID"]),
                      "start_sha": base,
                      "state": "ADMITTED_BEFORE_DISPATCH"
                  },
                  "execution_attempts": []
              }
              items.append(record)
              by_id[work_id]=record
              numeric=int(m.group(1))
              next_id=f"WORK-{numeric+1:04d}"
              registry["next_id"]=next_id
              admitted.append(work_id)

          if not admitted:
              print("PLAN_ADMISSION=NO_NEW_WORK_IDS")
              raise SystemExit(0)

          registry_path.write_text(
              json.dumps(registry,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )

          subprocess.check_call(["git","config","user.name","github-actions[bot]"])
          subprocess.check_call(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git","add",str(registry_path)])
          commit_label=",".join(admitted)
          subprocess.check_call(["git","commit","-m",f"governance(team): admit governed plan before dispatch ({commit_label})"])

          subprocess.check_call(["git","fetch","origin",target])
          current=subprocess.check_output(["git","rev-parse",f"origin/{target}"],text=True).strip()
          if current != base:
              raise SystemExit(f"BLOCKED: target changed during plan admission (base={base}, current={current})")
          subprocess.check_call(["git","push","origin",f"HEAD:refs/heads/{target}"])
          print("PLAN_ADMISSION=COMMITTED_AND_PUSHED")
          print("PLAN_ADMITTED_IDS="+",".join(admitted))
          PY
      - name: Capture immutable target state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/autonomous-product-factory
          START_SHA="$(git rev-parse origin/fix/autonomous-product-factory)"
          echo "start_sha=${START_SHA}" >> "${GITHUB_OUTPUT}"
          echo "TEAM_START_SHA=${START_SHA}"

      - name: Build dependency-aware worker leases
        id: pool
        shell: bash
        env:
          REQUESTED_MAX_PARALLEL: ${{ inputs.max_parallel || '8' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import fnmatch
          import json
          import os
          from pathlib import Path

          root = Path(".")
          manifest_path = root / ".kilo/team/TEAM-WORKER-V1.json"
          next_plan = root / ".kilo/team/NEXT-WAVE-PLAN.json"
          org_manifest_path = root / ".kilo/team/TEAM-ORGANIZATION-V2.json"
          org_protocol_path = root / ".kilo/team/TEAM-ORGANIZATION-V2-PROTOCOL.md"
          work_registry_path = root / ".kilo/team/memory/work-registry.json"
          mission_state_path = root / ".kilo/team/memory/mission-state.json"

          if not org_manifest_path.exists() or not org_protocol_path.exists():
              raise SystemExit("BLOCKED: Team Organization V2 manifest/protocol missing")
          if not work_registry_path.exists() or not mission_state_path.exists():
              raise SystemExit("BLOCKED: V2 team memory ledgers missing")
          org_manifest = json.loads(org_manifest_path.read_text(encoding="utf-8"))
          if org_manifest.get("status") != "ACTIVE":
              raise SystemExit("BLOCKED: Team Organization V2 is not ACTIVE")
          work_registry = json.loads(work_registry_path.read_text(encoding="utf-8"))
          if not work_registry.get("items"):
              raise SystemExit("BLOCKED: V2 Work Registry is empty")

          if not next_plan.exists():
              raise SystemExit("BLOCKED: Team Organization V2 is ACTIVE but NEXT-WAVE-PLAN.json is missing; do not fall back to the legacy 12-worker pool")

          plan = json.loads(next_plan.read_text(encoding="utf-8"))
          status = plan.get("wave_status")
          if status == "READY":
              leases = plan.get("leases", [])
              source = "NEXT-WAVE-PLAN"
          elif status in ("COMPLETE", "BLOCKED"):
              print(f"TEAM_WAVE_STATUS={status}")
              raise SystemExit(18)
          else:
              print(f"TEAM_WAVE_STATUS={status}")
              raise SystemExit("BLOCKED: V2 plan is not READY; no legacy-worker fallback is permitted")

          if not leases:
              raise SystemExit("BLOCKED: V2 READY plan has no eligible governed worker leases")

          print("TEAM_POOL_MODE=V2_DYNAMIC_READY_LEASES_ONLY")
          print(f"V1_SPECIALIST_CATALOG_SIZE={len(json.loads(manifest_path.read_text(encoding='utf-8')).get('workers', []))}")
          print("V1_SPECIALIST_CATALOG_IS_ACTIVE_WORKER_COUNT=FALSE")

          requested = int(os.environ.get("REQUESTED_MAX_PARALLEL") or 8)
          requested = max(1, min(requested, 100))

          protected = [
              ".github/", "Docs/ARCHITECTURE.md", "Docs/HOOSHYAROS_MASTER_CHARTER.md",
              "Docs/HOOSHYAROS_GOVERNANCE_CHARTER.md", "Assistant/SYSTEM_PROMPT.md",
              "package.json", "package-lock.json", ".env"
          ]

          def normalized_prefix(pattern: str) -> str:
              p = pattern.strip().lstrip("./")
              if "*" in p:
                  p = p.split("*", 1)[0]
              return p.rstrip("/")

          def overlaps(a: str, b: str) -> bool:
              aa, bb = normalized_prefix(a), normalized_prefix(b)
              return bool(aa) and bool(bb) and (aa == bb or aa.startswith(bb + "/") or bb.startswith(aa + "/"))

          seen_ids = set()
          active = []
          for lease in leases:
              required = ["id","role","focus","owner","mode","write_scope"]
              missing = [k for k in required if not lease.get(k)]
              if missing:
                  raise SystemExit(f"BLOCKED: lease {lease.get('id','unknown')} missing {missing}")
              lid = lease["id"]
              if lid in seen_ids:
                  raise SystemExit(f"BLOCKED: duplicate lease id {lid}")
              seen_ids.add(lid)

              import re
              match = re.match(r"^work-([0-9]{4})(?:-|$)", lid)
              if not match:
                  raise SystemExit(f"BLOCKED: V2 lease {lid} lacks stable WORK-#### identity")
              work_id = f"WORK-{match.group(1)}"
              work_items = [x for x in work_registry.get("items", []) if x.get("id") == work_id]
              if len(work_items) != 1:
                  raise SystemExit(f"BLOCKED: V2 lease {lid} has no unique Work Registry record {work_id}")
              work_item = work_items[0]
              work_status = str(work_item.get("status", "")).upper()
              work_readiness = str(work_item.get("readiness", "")).upper()

              # V2 dispatch is fail-closed: only explicitly READY work may execute.
              if work_status != "READY" or work_readiness != "READY":
                  raise SystemExit(
                      f"BLOCKED: V2 lease {lid} is not dispatch-ready in Work Registry "
                      f"(status={work_status}, readiness={work_readiness})"
                  )

              registry_by_id = {str(x.get("id")): x for x in work_registry.get("items", [])}
              satisfied_statuses = {"COMPLETED", "VERIFIED", "PROMOTED", "MEMORIZED", "CLOSED"}
              for dep in work_item.get("dependencies", []) or []:
                  if str(dep).startswith("WORK-"):
                      dep_item = registry_by_id.get(str(dep))
                      if not dep_item:
                          raise SystemExit(f"BLOCKED: V2 lease {lid} missing dependency record {dep}")
                      dep_status = str(dep_item.get("status", "")).upper()
                      if dep_status not in satisfied_statuses:
                          raise SystemExit(
                              f"BLOCKED: V2 lease {lid} dependency {dep} is not satisfied "
                              f"(status={dep_status})"
                          )

              attempts = work_item.get("execution_attempts", []) or []
              unresolved_attempts = [
                  a for a in attempts
                  if not bool(a.get("promoted"))
                  and str(a.get("state", "")).upper() not in {"SUPERSEDED", "DUPLICATE", "INVALID"}
              ]
              if unresolved_attempts:
                  raise SystemExit(
                      f"BLOCKED: V2 lease {lid} has unresolved prior execution attempts; "
                      f"recover/QC/promote existing evidence before re-dispatch"
                  )

              scope = [str(x) for x in lease["write_scope"]]
              result_root = f".kilo/team/results/{lid}/"
              if result_root not in scope:
                  raise SystemExit(f"BLOCKED: lease {lid} must include its evidence root {result_root}")

              for item in scope:
                  norm = item.lstrip("./")
                  if any(norm == p.rstrip("/") or norm.startswith(p) for p in protected):
                      raise SystemExit(f"BLOCKED: lease {lid} touches protected path {item}")

              for prev in active:
                  for a in scope:
                      for b in prev["write_scope"]:
                          if overlaps(a, b):
                              raise SystemExit(
                                  f"BLOCKED: uncontrolled write-scope overlap: "
                                  f"{lid}:{a} <-> {prev['id']}:{b}"
                              )

              active.append(dict(lease))
              if len(active) >= requested:
                  break

          matrix = {
              "include": [
                  {
                      "id": x["id"],
                      "role": x["role"],
                      "focus": x["focus"],
                      "owner": x["owner"],
                      "mode": x["mode"],
                      "write_scope_json": json.dumps(x["write_scope"], ensure_ascii=False, separators=(",", ":")),
                      "write_root": f".kilo/team/results/{x['id']}/"
                  }
                  for x in active
              ]
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps(matrix, ensure_ascii=False, separators=(",", ":")) + "\n")
              out.write(f"max_parallel={min(requested, len(active))}\n")
              out.write("lease_ids=" + json.dumps([x["id"] for x in active], separators=(",", ":")) + "\n")

          print(f"LEASE_SOURCE={source}")
          print(f"TEAM_LEASES={len(active)}")
          print(f"MAX_PARALLEL={min(requested, len(active))}")
          for x in active:
              print(f"LEASE={x['id']} mode={x['mode']} owner={x['owner']}")
          PY
      - name: Team Manager — Reserve admitted leases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.state.outputs.start_sha }}
          LEASE_IDS: ${{ steps.pool.outputs.lease_ids }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          target="fix/autonomous-product-factory"
          base=os.environ["BASE_SHA"]
          lease_ids=json.loads(os.environ["LEASE_IDS"])
          registry_path=Path(".kilo/team/memory/work-registry.json")
          registry=json.loads(registry_path.read_text(encoding="utf-8"))
          by_id={str(x.get("id")):x for x in registry.get("items",[])}
          run_id=int(os.environ["GITHUB_RUN_ID"])

          for lid in lease_ids:
              m=re.match(r"^work-([0-9]{4})(?:-|$)",str(lid))
              if not m: raise SystemExit(f"BLOCKED: invalid lease id {lid}")
              work_id=f"WORK-{m.group(1)}"
              item=by_id.get(work_id)
              if not item: raise SystemExit(f"BLOCKED: reservation missing {work_id}")
              if str(item.get("status","" )).upper()!="READY" or str(item.get("readiness","" )).upper()!="READY":
                  raise SystemExit(f"BLOCKED: reservation requires READY {work_id}")
              reservations=item.setdefault("reservations",[])
              if any(int(x.get("run_id",-1))==run_id and str(x.get("state","" )).upper()=="EXECUTING" for x in reservations):
                  print(f"RESERVATION_EXISTING={work_id}")
                  continue
              attempts=item.setdefault("execution_attempts",[])
              if any(int(x.get("run_id",-1))==run_id for x in attempts):
                  raise SystemExit(f"BLOCKED: execution attempt already exists for {work_id} in run {run_id}")
              attempts.append({
                  "run_id":run_id, "state":"RESERVED_EXECUTING", "promoted":False,
                  "commit":None, "start_sha":base, "lease_id":str(lid),
                  "reserved_at":datetime.now(timezone.utc).isoformat()
              })
              reservations.append({
                  "run_id":run_id, "lease_id":str(lid), "start_sha":base,
                  "state":"EXECUTING", "planned_branch":f"opencode/team-{lid}-{run_id}"
              })
              item["reservations"]=reservations
              item["last_state_change_by"]=f"TEAM_MANAGER_RESERVATION_{run_id}"

          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          subprocess.check_call(["git","config","user.name","github-actions[bot]"])
          subprocess.check_call(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git","add",str(registry_path)])
          subprocess.check_call(["git","commit","-m",f"governance(team): reserve execution leases for run {run_id}"])
          subprocess.check_call(["git","fetch","origin",target])
          current=subprocess.check_output(["git","rev-parse",f"origin/{target}"],text=True).strip()
          if current!=base:
              raise SystemExit(f"BLOCKED: target changed during lease reservation (base={base}, current={current})")
          subprocess.check_call(["git","push","origin",f"HEAD:refs/heads/{target}"])
          print("LEASE_RESERVATION=COMMITTED_AND_PUSHED")
          print("LEASE_RESERVATION_RUN="+str(run_id))
          print("LEASE_RESERVATION_IDS="+",".join(map(str,lease_ids)))
          PY

      - name: Capture final immutable execution state
        id: final_state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/autonomous-product-factory
          START_SHA="$(git rev-parse origin/fix/autonomous-product-factory)"
          echo "start_sha=${START_SHA}" >> "${GITHUB_OUTPUT}"
          echo "TEAM_START_SHA=${START_SHA}"
  model-qualification:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      candidates: ${{ steps.qualify.outputs.candidates }}
      selected: ${{ steps.qualify.outputs.selected }}
      route_plans: ${{ steps.qualify.outputs.route_plans }}
    permissions:
      contents: read
      actions: read
    env:
      START_SHA: ${{ needs.prepare.outputs.start_sha }}
      LEASE_MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

    steps:
      - name: Checkout immutable qualification base
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.start_sha }}
          fetch-depth: 0

      - name: Install OpenCode with bounded recovery
        shell: bash
        run: |
          set -euo pipefail
          install_ok=0
          for attempt in 1 2 3; do
            echo "QUALIFICATION_INSTALL_ATTEMPT=${attempt}"
            if curl -fsSL https://opencode.ai/install | bash && "$HOME/.opencode/bin/opencode" --version; then
              install_ok=1
              break
            fi
            echo "QUALIFICATION_INSTALL_FAILED_ATTEMPT=${attempt}"
            test "${attempt}" -lt 3 && sleep 5
          done
          test "${install_ok}" -eq 1 || {
            echo "BLOCKED_EXTERNAL: OpenCode installation failed in model qualification gate"
            exit 40
          }
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Preflight OpenCode CLI for model qualification
        shell: bash
        run: |
          set -euo pipefail
          opencode run --help > "${RUNNER_TEMP}/qualification-run-help.txt" 2>&1
          grep -q -- "--model" "${RUNNER_TEMP}/qualification-run-help.txt"
          grep -q -- "--agent" "${RUNNER_TEMP}/qualification-run-help.txt"
          grep -q -- "--auto" "${RUNNER_TEMP}/qualification-run-help.txt"
          echo "Model qualification CLI preflight: PASS"
      - name: Qualify free models per lease task class
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          CATALOG="${RUNNER_TEMP}/opencode-models-verbose.txt"
          ROUTING="${RUNNER_TEMP}/qualified-model-routing.env"
          "\$HOME/.opencode/bin/opencode" models --refresh --verbose > "${CATALOG}" 2>&1

          python3 - "${CATALOG}" "${ROUTING}" "${LEASE_MATRIX_JSON}" <<'PY'
          import json, math, os, re, subprocess, sys, time
          catalog_path=sys.argv[1]
          out_file=sys.argv[2]
          matrix=json.loads(sys.argv[3])
          raw=open(catalog_path,encoding="utf-8",errors="replace").read()
          raw=re.sub(r"\\x1b\\[[0-?]*[ -/]*[@-~]","",raw)
          lines=raw.splitlines()
          decoder=json.JSONDecoder()
          models={}
          def is_id(v): return bool(re.fullmatch(r"[^\\s/]+/[^\\s]+",v.strip()))
          for i,line in enumerate(lines):
              mid=line.strip()
              if not is_id(mid): continue
              block="\\n".join(lines[i+1:]).lstrip()
              brace=block.find("{")
              if brace<0: continue
              try: obj,_=decoder.raw_decode(block[brace:])
              except Exception: continue
              if isinstance(obj,dict): models[mid]=obj

          modes=[]
          for item in (matrix.get("include") or []):
              mode=str(item.get("mode","")).upper()
              if mode not in {"AUDIT","IMPLEMENT","REVIEW","VERIFY"}:
                  raise SystemExit(f"BLOCKED: unsupported lease mode for routing: {mode}")
              if mode not in modes: modes.append(mode)

          def authoritatively_free(m):
              cost=m.get("cost")
              if not isinstance(cost,dict) or not cost: return False
              vals=list(cost.values())
              return all(isinstance(v,(int,float)) and not isinstance(v,bool) and v==0 for v in vals)

          def provider(mid): return mid.split("/",1)[0] if "/" in mid else mid

          def score(mid,m):
              caps=m.get("capabilities") or {}
              lim=m.get("limit") or {}
              reasoning=m.get("reasoning") is True or caps.get("reasoning") is True
              tool=m.get("tool_call") is True or caps.get("toolcall") is True or caps.get("tool_call") is True
              ctx=int(lim.get("context") or 0); out=int(lim.get("output") or 0)
              structured=m.get("structured_output") is True or caps.get("structured_output") is True
              return (100 + (35 if reasoning else 0) + (30 if tool else 0) +
                      (20 if structured else 0) +
                      min(40.0,max(0.0,math.log2(max(ctx,1)/100000))*8.0) +
                      min(35.0,max(0.0,math.log2(max(out,1)/8000))*5.0))

          eligible=[]
          for mid,m in models.items():
              caps=m.get("capabilities") or {}
              lim=m.get("limit") or {}
              reasoning=m.get("reasoning") is True or caps.get("reasoning") is True
              tool=m.get("tool_call") is True or caps.get("toolcall") is True or caps.get("tool_call") is True
              ctx=int(lim.get("context") or 0); out=int(lim.get("output") or 0)
              if authoritatively_free(m) and reasoning and tool and ctx>=32000 and out>=4000:
                  eligible.append((score(mid,m),mid,ctx,out))

          print(f"MODEL_CATALOG_PARSED={len(models)}")
          print(f"MODEL_FREE_ELIGIBLE={len(eligible)}")
          if not eligible: raise SystemExit("BLOCKED_FREE_MODEL_UNAVAILABLE")

          probes={
            "AUDIT":"You qualify for AUDIT work. Do not modify files. A=100, B=120, C is the signed source and says 100. Return exactly: TASK_PROBE=PASS, TASK=AUDIT, CONTRADICTION=TRUE, AUTHORITY=C, VALUE=100.",
            "IMPLEMENT":"You qualify for IMPLEMENT work. Do not modify files. A defect is in F and regression test T exists. Return exactly: TASK_PROBE=PASS, TASK=IMPLEMENT, MINIMAL_CHANGE=TRUE, TEST=T, SCOPE=BOUNDED.",
            "REVIEW":"You qualify for REVIEW/QC work. Do not modify files. Worker claims a file was changed but patch does not contain it. Return exactly: TASK_PROBE=PASS, TASK=REVIEW, FALSE_GREEN=TRUE, CHECK=ACTUAL_PATCH.",
            "VERIFY":"You qualify for VERIFY work. Do not modify files. Test is green but ran from a different commit than START_SHA. Return exactly: TASK_PROBE=PASS, TASK=VERIFY, VALID=FALSE, ACTION=REVERIFY."
          }

          routes={}; union=[]; seen=set()
          for mode in modes:
              passed=[]
              for base,mid,ctx,out in sorted(eligible,reverse=True)[:4]:
                  start=time.monotonic()
                  try:
                      proc=subprocess.run([
                          os.path.join(os.environ["HOME"],".opencode","bin","opencode"),
                          "run","--auto","--agent","plan","--model",mid,probes[mode]
                      ],text=True,capture_output=True,timeout=110)
                      combined=(proc.stdout or "")+"\\n"+(proc.stderr or "")
                      ok=proc.returncode==0 and "TASK_PROBE=PASS" in combined and f"TASK={mode}" in combined
                  except Exception:
                      ok=False
                  elapsed=round(time.monotonic()-start,2)
                  if ok:
                      passed.append((base,-elapsed,mid,provider(mid),ctx,out))
                      print(f"MODEL_PROBE_PASS={mode}:{mid} elapsed={elapsed:.2f}")
                  else:
                      print(f"MODEL_PROBE_FAIL={mode}:{mid} elapsed={elapsed:.2f}")
              if not passed:
                  raise SystemExit(f"BLOCKED_FREE_MODEL_UNAVAILABLE:{mode}")
              passed.sort(reverse=True)
              chosen=[]; providers=set()
              for row in passed:
                  if row[3] not in providers:
                      chosen.append(row); providers.add(row[3])
                  if len(chosen)==3: break
              for row in passed:
                  if len(chosen)==3: break
                  if row not in chosen: chosen.append(row)
              route=[{"rank":i+1,"model":r[2],"provider":r[3],"qualification":"PASS","task_class":mode,
                      "probe_elapsed_s":round(-r[1],2),"context":r[4],"output":r[5]} for i,r in enumerate(chosen)]
              routes[mode]=route
              for r in chosen:
                  if r[2] not in seen:
                      seen.add(r[2]); union.append(r[2])
              print("MODEL_ROUTE_PLAN="+mode+":"+"|".join(x["model"] for x in route))

          compact=json.dumps(routes,ensure_ascii=False,separators=(",",":"))
          selected=routes[modes[0]][0]["model"]
          open(out_file,"w",encoding="utf-8").write("QUALIFIED_MODELS="+"|".join(union)+"\\nQUALIFIED_SELECTED="+selected+"\\nQUALIFIED_ROUTE_PLANS="+compact+"\\n")
          print("MODEL_ROUTING_POLICY=LEASE_TASK_CLASS")
          print("MODEL_ROUTING_NO_NAMED_FREE_HEURISTIC=TRUE")
          PY

          cat "${ROUTING}" >> "\$GITHUB_ENV"
          CANDIDATES="\$(sed -n 's/^QUALIFIED_MODELS=//p' "${ROUTING}")"
          SELECTED="\$(sed -n 's/^QUALIFIED_SELECTED=//p' "${ROUTING}")"
          ROUTE_PLANS="\$(sed -n 's/^QUALIFIED_ROUTE_PLANS=//p' "${ROUTING}")"
          test -n "${CANDIDATES}" && test -n "${SELECTED}" && test -n "${ROUTE_PLANS}"
          echo "candidates=${CANDIDATES}" >> "${GITHUB_OUTPUT}"
          echo "selected=${SELECTED}" >> "${GITHUB_OUTPUT}"
          echo "route_plans=${ROUTE_PLANS}" >> "${GITHUB_OUTPUT}"
          echo "QUALIFIED_ROUTE_PLANS=${ROUTE_PLANS}"


  team-worker:
    needs: [prepare, model-qualification]
    if: ${{ needs.prepare.result == 'success' && needs.model-qualification.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: write
      issues: write
      actions: read
    env:
      TARGET_BRANCH: fix/autonomous-product-factory
      START_SHA: ${{ needs.prepare.outputs.start_sha }}
      WORKER_ID: ${{ matrix.id }}
      WORKER_ROLE: ${{ matrix.role }}
      WORKER_FOCUS: ${{ matrix.focus }}
      OWNER_ENGINE: ${{ matrix.owner }}
      WORKER_MODE: ${{ matrix.mode }}
      WRITE_ROOT: ${{ matrix.write_root }}
      WRITE_SCOPE_JSON: ${{ matrix.write_scope_json }}
      MODEL_POLICY: adaptive-free
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout immutable worker base
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.start_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create isolated worker branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -b "opencode/team-${WORKER_ID}-${GITHUB_RUN_ID}" "${START_SHA}"
          test -z "$(git status --porcelain)"

      - name: Bind Team V2 memory context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          lid=os.environ["WORKER_ID"]
          m=re.match(r"^work-([0-9]{4})(?:-|$)", lid)
          if not m:
              raise SystemExit(f"BLOCKED: worker {lid} lacks stable WORK-#### identity")
          work_id=f"WORK-{m.group(1)}"
          root=Path(".kilo/team/memory")
          required=["mission-state.json","work-registry.json","evidence-registry.json","decision-registry.json","defect-registry.json","blocker-registry.json","commit-registry.json","wave-history.json"]
          for name in required:
              if not (root/name).exists():
                  raise SystemExit(f"BLOCKED: V2 memory file missing: {name}")
          registry=json.loads((root/"work-registry.json").read_text(encoding="utf-8"))
          matches=[x for x in registry.get("items",[]) if x.get("id")==work_id]
          if len(matches)!=1:
              raise SystemExit(f"BLOCKED: no unique Work Registry item for {work_id}")
          status=str(matches[0].get("status","")).upper()
          if status in {"CLOSED","MEMORIZED","PROMOTED","DUPLICATE","SUPERSEDED"}:
              raise SystemExit(f"BLOCKED: terminal Work Registry status for {work_id}: {status}")
          print(f"V2_WORK_ID={work_id}")
          print(f"V2_WORK_STATUS={status}")
          print("V2_MEMORY_CONTEXT=READY")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              out.write(f"WORK_ID={work_id}\n")
          PY

      - name: Install repository dependencies when required
        if: ${{ matrix.mode == 'IMPLEMENT' || matrix.mode == 'VERIFY' }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          install_ok=0
          for attempt in 1 2; do
            echo "OPENCODE_INSTALL_ATTEMPT=${attempt}"
            if curl -fsSL https://opencode.ai/install | bash && "$HOME/.opencode/bin/opencode" --version; then
              install_ok=1
              break
            fi
            echo "OPENCODE_INSTALL_FAILED_ATTEMPT=${attempt}"
            if test "$attempt" -lt 2; then
              sleep 5
            fi
          done
          test "$install_ok" -eq 1 || {
            echo "BLOCKED_EXTERNAL: OpenCode installation/version verification failed after bounded retry"
            exit 40
          }
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Bind lease-specific qualified free-model route
        shell: bash
        env:
          ROUTE_PLANS: ${{ needs.model-qualification.outputs.route_plans }}
          WORK_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          test -n "${ROUTE_PLANS}"
          python3 - <<'PY'
          import json,os
          mode=os.environ["WORK_MODE"].upper()
          plans=json.loads(os.environ["ROUTE_PLANS"])
          route=plans.get(mode) or []
          if not route: raise SystemExit(f"BLOCKED_FREE_MODEL_UNAVAILABLE: no qualified route for {mode}")
          models=[x["model"] for x in route]
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              out.write("MODEL_CANDIDATES="+"|".join(models)+"\n")
              out.write("SELECTED_MODEL="+models[0]+"\n")
              out.write("MODEL_ROUTING_TASK_CLASS="+mode+"\n")
              out.write("ROUTE_PLAN_JSON="+json.dumps(route,ensure_ascii=False,separators=(",",":"))+"\n")
          print("MODEL_SELECTION_STATUS=LEASE_SPECIFIC")
          print("MODEL_ROUTING_TASK_CLASS="+mode)
          print("MODEL_SELECTED_FOR_WORKER="+models[0])
          print("MODEL_CANDIDATES="+"|".join(models))
          PY

      - name: Preflight OpenCode CLI contract
        shell: bash
        run: |
          set -euo pipefail
          opencode run --help > "${RUNNER_TEMP}/opencode-run-help.txt" 2>&1
          grep -q -- "--model" "${RUNNER_TEMP}/opencode-run-help.txt"
          grep -q -- "--auto" "${RUNNER_TEMP}/opencode-run-help.txt"
          grep -q -- "--agent" "${RUNNER_TEMP}/opencode-run-help.txt"
          if grep -q -- "--standalone" "${RUNNER_TEMP}/opencode-run-help.txt"; then
            echo "OPENCODE_STANDALONE_SUPPORTED=TRUE"
          else
            echo "OPENCODE_STANDALONE_SUPPORTED=FALSE"
          fi
          echo "OpenCode CLI contract preflight: PASS"

      - name: Run assigned governed work lease
        shell: bash
        run: |
          set -euo pipefail
          PROMPT="${RUNNER_TEMP}/team-worker-prompt.md"
          cat > "${PROMPT}" <<EOF
          You are one member of the governed HooshyarOS autonomous team.

          WORKER_ID = ${WORKER_ID}
          WORK_ID = ${WORK_ID}
          ROLE = ${WORKER_ROLE}
          OWNER_ENGINE = ${OWNER_ENGINE}
          MODE = ${WORKER_MODE}
          FOCUS = ${WORKER_FOCUS}
          START_SHA = ${START_SHA}
          WRITE_ROOT = ${WRITE_ROOT}
          WRITE_SCOPE = ${WRITE_SCOPE_JSON}
          TEAM_ORGANIZATION_VERSION = V2
          TEAM_MEMORY_ROOT = .kilo/team/memory/

          AUTHORITIES:
          1. Docs/HOOSHYAROS_MASTER_CHARTER.md
          2. Docs/HOOSHYAROS_GOVERNANCE_CHARTER.md
          3. Docs/ARCHITECTURE.md
          4. Assistant/SYSTEM_PROMPT.md
          5. Docs/OPENCODE_EXECUTION_OPERATOR_CONTRACT.md
          6. Docs/COMMERCIAL_PRODUCT_COMPLETION_CONTRACT.md
          7. AGENTS.md
          8. .kilo/plans/ACTIVE-AUTONOMOUS-INTELLIGENCE-QUALITY-PRODUCT-EVOLUTION-MISSION.md
          9. .kilo/team/TEAM-WORKER-V1-PROTOCOL.md
          10. .kilo/team/TEAM-ORGANIZATION-V2.json
          11. .kilo/team/TEAM-ORGANIZATION-V2-PROTOCOL.md
          12. .kilo/team/memory/mission-state.json
          13. .kilo/team/memory/work-registry.json
          14. .kilo/team/memory/evidence-registry.json
          15. .kilo/team/memory/decision-registry.json
          16. .kilo/team/memory/defect-registry.json
          17. .kilo/team/memory/blocker-registry.json
          18. .kilo/team/memory/commit-registry.json
          19. .kilo/team/memory/wave-history.json
          20. .kilo/team/NEXT-WAVE-PLAN.schema.json

          V2 MEMORY RULE:
          - Reconstruct the current work state from .kilo/team/memory before acting.
          - Treat the Work Registry as the anti-duplication gate.
          - Do not repeat DONE/VERIFIED/ACCEPTED/SUPERSEDED/DUPLICATE work without current regression or invalidation evidence.
          - Preserve stale and failed evidence; never edit memory to make an outcome appear successful.
          - Record contradictions explicitly as findings/overlaps.

          CORE RULE:
          Execute ONLY the leased focus and ONLY within WRITE_SCOPE.
          The lease is one coherent Micro-Stage. Do not select another task.

          MODE CONTRACT:
          - AUDIT: inspect and reconcile; no product implementation.
          - IMPLEMENT: implement the assigned capability minimally within scope; test it; preserve architecture.
          - REVIEW: independently review the assigned capability/evidence; do not alter product semantics.
          - VERIFY: run the required verification and repair only the same leased capability.

          FOR ALL MODES:
          - current repository state overrides stale checkpoints;
          - do not restart accepted F1/F6/CCC/UX without current regression evidence;
          - do not modify Architecture Freeze V4/V4.1 or governance authority;
          - do not modify GitHub workflows, package manifests, secrets, deployment settings, or protected paths;
          - do not access or transmit secrets, personal data, or confidential customer financial data;
          - do not weaken/delete tests;
          - do not force-push, reset hard, rewrite history, or push the target branch;
          - use existing owners/providers before creating anything new;
          - preserve exact provenance;
          - run proportional verification;
          - create ONE coherent commit for this lease;
          - write exactly ONE evidence report at ${WRITE_ROOT}result.md;
          - do not modify the current lease's execution_attempts, reservations, promoted flags, or promotion metadata; Integrator exclusively owns promotion closure;
          - Memory & Editor may reconcile factual memory/status fields for prior work, but the current lease reservation/promotion state is Manager/Integrator-owned;
          - stop after the committed Micro-Stage.

          REPORT SECTIONS:
          # STATUS
          # SCOPE
          # CURRENT_EVIDENCE
          # FINDINGS
          # DEPENDENCIES
          # RISKS
          # OVERLAPS
          # RECOMMENDED_NEXT_MICRO_STAGE
          # VERIFICATION_METHOD
          # PROVENANCE

          For IMPLEMENT/VERIFY, also include:
          # CHANGED_FILES
          # TEST_RESULTS

          Never claim success from model output alone. The outer workflow will validate changed paths, commit count and report structure.
          EOF

          LOG="${RUNNER_TEMP}/opencode-team-${WORKER_ID}.log"
          : > "${LOG}"
          status=1
          IFS='|' read -r -a CANDIDATES <<< "${MODEL_CANDIDATES}"

          for candidate in "${CANDIDATES[@]}"; do
            echo "MODEL_ATTEMPT=${candidate}" | tee -a "${LOG}"
            if timeout --signal=TERM --kill-after=30s 20m opencode run --auto --model "${candidate}" "$(cat "${PROMPT}")" 2>&1 | tee -a "${LOG}"; then
              status=0
              echo "MODEL_SELECTED=${candidate}" | tee -a "${LOG}"
              echo "MODEL=${candidate}" >> "${GITHUB_ENV}"
              break
            fi
            echo "MODEL_FAILED=${candidate}" | tee -a "${LOG}"
          done

          test "${status}" -eq 0

      - name: Validate isolated worker result
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          REPORT="${WRITE_ROOT}result.md"
          test -f "${REPORT}"
          REPORT_BYTES="$(wc -c < "${REPORT}")"
          test "${REPORT_BYTES}" -ge 1200 || {
            echo "BLOCKED: evidence report too small (${REPORT_BYTES} bytes)"
            exit 21
          }
          python3 - "${REPORT}" <<'PY'
          import re, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          text=p.read_text(encoding="utf-8", errors="replace")
          required=["STATUS","SCOPE","CURRENT_EVIDENCE","FINDINGS","DEPENDENCIES","RISKS","OVERLAPS","RECOMMENDED_NEXT_MICRO_STAGE","VERIFICATION_METHOD","PROVENANCE"]
          sections={}
          for m in re.finditer(r"^# ([A-Z0-9_]+)\s*$", text, re.M):
              sections[m.group(1)]=m.end()
          missing=[x for x in required if x not in sections]
          if missing:
              raise SystemExit("BLOCKED: missing report sections: "+", ".join(missing))
          for name in ("CURRENT_EVIDENCE","FINDINGS","PROVENANCE"):
              starts=[m.end() for m in re.finditer(rf"^# {re.escape(name)}\s*$",text,re.M)]
              if not starts:
                  raise SystemExit(f"BLOCKED: section {name} missing")
              idx=starts[0]
              nxt=re.search(r"^# [A-Z0-9_]+\s*$",text[idx:],re.M)
              body=text[idx: idx+(nxt.start() if nxt else len(text))].strip()
              if len(body)<120:
                  raise SystemExit(f"BLOCKED: section {name} lacks substantive evidence")
          status=re.search(r"^# STATUS\s*\n+(.+)$",text,re.M)
          if not status or not status.group(1).strip():
              raise SystemExit("BLOCKED: STATUS is empty")
          unresolved = [
              line.strip() for line in text.splitlines()
              if line.strip().upper() in {"TODO", "TBD", "FILL ME", "PLACEHOLDER"}
          ]
          if unresolved:
              raise SystemExit("BLOCKED: unresolved placeholder-only line remains in evidence report")
          if not re.search(r"(?:\.tsx?|\.ts|\.js|\.json|\.md|\.yml|\.yaml|\.github/|\.kilo/|Backend/|Docs/|web/)", text):
              raise SystemExit("BLOCKED: PROVENANCE contains no repository path")
          PY
          test -z "$(git status --porcelain)" || {
            echo "BLOCKED: uncommitted changes remain after worker commit"
            exit 21
          }

          git diff --check "${START_SHA}...HEAD" -- . ':(exclude)*.md' ':(exclude)*.markdown'
          if ! git diff --check "${START_SHA}...HEAD" -- '*.md' '*.markdown'; then
            echo "WARNING: evidence Markdown contains formatting whitespace; semantic evidence remains subject to content/QC gates."
          fi
          AHEAD="$(git rev-list --count "${START_SHA}..HEAD")"
          test "${AHEAD}" -eq 1 || {
            echo "BLOCKED: worker commit count = ${AHEAD}, expected 1"
            exit 22
          }

          while IFS= read -r path; do
            test -n "${path}" || continue
            python3 - "${path}" "${WRITE_SCOPE_JSON}" <<'PY'
          import json,sys
          from pathlib import PurePosixPath

          path=sys.argv[1].replace("\\","/")
          scopes=json.loads(sys.argv[2])

          def covered(p, scope):
              s=scope.replace("\\","/").lstrip("./")
              p=p.lstrip("./")
              if "*" in s:
                  prefix=s.split("*",1)[0]
                  return p.startswith(prefix)
              return p == s.rstrip("/") or p.startswith(s.rstrip("/") + "/")

          if not any(covered(path, s) for s in scopes):
              raise SystemExit(f"BLOCKED: out-of-scope path {path}; scope={scopes}")
          PY
          done < <(git diff --name-only "${START_SHA}...HEAD")

          for required in STATUS SCOPE CURRENT_EVIDENCE FINDINGS DEPENDENCIES RISKS OVERLAPS RECOMMENDED_NEXT_MICRO_STAGE VERIFICATION_METHOD PROVENANCE; do
            grep -q "^# ${required}$" "${WRITE_ROOT}result.md" || {
              echo "BLOCKED: missing report section ${required}"
              exit 23
            }
          done

          if test "${WORKER_MODE}" = "IMPLEMENT" || test "${WORKER_MODE}" = "VERIFY"; then
            grep -q "^# CHANGED_FILES$" "${WRITE_ROOT}result.md" || exit 24
            grep -q "^# TEST_RESULTS$" "${WRITE_ROOT}result.md" || exit 25
          fi

          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "commit_sha=${COMMIT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Preserve isolated worker branch and execution snapshot
        if: ${{ always() }}
        id: preserve_worker
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set +e
          BRANCH="opencode/team-${WORKER_ID}-${GITHUB_RUN_ID}"
          AHEAD="$(git rev-list --count "${START_SHA}..HEAD" 2>/dev/null || echo 0)"
          DIRTY="$(git status --porcelain 2>/dev/null || true)"
          mkdir -p "${RUNNER_TEMP}/worker-preservation"
          git status --short > "${RUNNER_TEMP}/worker-preservation/status.txt" 2>&1 || true
          git log -1 --format="%H%n%s%n%an%n%ae" > "${RUNNER_TEMP}/worker-preservation/head.txt" 2>&1 || true
          git diff --binary "${START_SHA}...HEAD" > "${RUNNER_TEMP}/worker-preservation/worker.patch" 2>&1 || true
          COMMIT_SHA=""
          PUSH_RC=0
          PRESERVED="FALSE"
          if test "${AHEAD}" -eq 1 && test -z "${DIRTY}"; then
            COMMIT_SHA="$(git rev-parse HEAD)"
            git push origin "HEAD:${BRANCH}"
            PUSH_RC=$?
            if test "${PUSH_RC}" -eq 0; then PRESERVED="TRUE"; fi
          fi
          echo "commit_sha=${COMMIT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "branch_preserved=${PRESERVED}" >> "${GITHUB_OUTPUT}"
          printf "START_SHA=%s\nWORKER_ID=%s\nWORK_ID=%s\nAHEAD=%s\nVALIDATE_OUTCOME=%s\nPUSH_RC=%s\nBRANCH_PRESERVED=%s\nCOMMIT_SHA=%s\n" \
            "${START_SHA}" "${WORKER_ID}" "${WORK_ID}" "${AHEAD}" "${VALIDATE_OUTCOME}" "${PUSH_RC}" "${PRESERVED}" "${COMMIT_SHA}" \
            > "${RUNNER_TEMP}/worker-preservation/state.txt"
          if test "${VALIDATE_OUTCOME}" = "success" && test "${PUSH_RC}" -ne 0; then
            echo "BLOCKED: validated worker commit could not be preserved remotely"
            exit 41
          fi
          exit 0

      - name: Persist worker result envelope
        if: always()
        shell: bash
        run: |
          set +e
          STATUS="FAILED"
          if test -f "${WRITE_ROOT}result.md" && test -n "${{ steps.validate.outputs.commit_sha }}"; then STATUS="SUCCESS"; fi
          mkdir -p "${RUNNER_TEMP}/team-result/${WORKER_ID}"
          cp -f "${WRITE_ROOT}result.md" "${RUNNER_TEMP}/team-result/${WORKER_ID}/result.md" 2>/dev/null || true
          LOG="${RUNNER_TEMP}/opencode-team-${WORKER_ID}.log"
          python3 - "${RUNNER_TEMP}/team-result/${WORKER_ID}/result.json" <<PY
          import json,pathlib,sys
          log=pathlib.Path("${LOG}")
          attempts=[]
          for line in (log.read_text(encoding="utf-8",errors="replace").splitlines() if log.exists() else []):
              if line.startswith("MODEL_ATTEMPT="):
                  attempts.append({"model":line.split("=",1)[1],"result":"ATTEMPTED"})
              elif line.startswith("MODEL_FAILED="):
                  m=line.split("=",1)[1]
                  for a in reversed(attempts):
                      if a["model"]==m and a["result"]=="ATTEMPTED": a["result"]="FAILED"; break
              elif line.startswith("MODEL_SELECTED="):
                  m=line.split("=",1)[1]
                  for a in reversed(attempts):
                      if a["model"]==m: a["result"]="SELECTED"; break
          result={
            "worker_id":"${WORKER_ID}","role":"${WORKER_ROLE}","owner_engine":"${OWNER_ENGINE}",
            "mode":"${WORKER_MODE}","task_class":"${MODEL_ROUTING_TASK_CLASS:-${WORKER_MODE}}",
            "status":"${STATUS}","commit_sha":"${{ steps.preserve_worker.outputs.commit_sha }}",
            "branch":"opencode/team-${WORKER_ID}-${GITHUB_RUN_ID}","start_sha":"${START_SHA}",
            "model":"${MODEL:-unknown}","route_plan":json.loads(r''' ${ROUTE_PLAN_JSON:-[]} '''.strip() or "[]"),
            "model_attempts":attempts,"write_scope":json.loads(r''' ${WRITE_SCOPE_JSON} ''')
          }
          open(sys.argv[1],"w",encoding="utf-8").write(json.dumps(result,ensure_ascii=False,indent=2))
          PY


      - name: Upload worker result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: team-result-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/team-result/${{ matrix.id }}/
            ${{ runner.temp }}/opencode-team-${{ matrix.id }}.log
            ${{ runner.temp }}/worker-preservation/
          if-no-files-found: warn

  quality-control:
    needs: [prepare, model-qualification, team-worker]
    if: ${{ always() && needs.prepare.result == 'success' && needs.model-qualification.result == 'success' && needs.team-worker.result != 'cancelled' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      START_SHA: ${{ needs.prepare.outputs.start_sha }}
      LEASE_IDS: ${{ needs.prepare.outputs.lease_ids }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - name: Checkout immutable QC base
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.start_sha }}
          fetch-depth: 0

      - name: Download worker result artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: team-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/team-results

      - name: Build QC workspace
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${LEASE_IDS}"
          mapfile -t RESULT_FILES < <(find "${RUNNER_TEMP}/team-results" -name result.json -type f | sort)
          test "${#RESULT_FILES[@]}" -gt 0

          python3 - "${EXPECTED}" "${RUNNER_TEMP}/team-results" <<'PY'
          import json, pathlib, shutil, sys, subprocess

          expected=json.loads(sys.argv[1])
          root=pathlib.Path(sys.argv[2])
          repo=pathlib.Path(".")
          found={}

          for p in root.rglob("result.json"):
              obj=json.loads(p.read_text(encoding="utf-8"))
              found[obj["worker_id"]]=obj

          missing=[x for x in expected if x not in found]
          if missing:
              raise SystemExit("QC_FAIL: missing worker envelopes: "+", ".join(missing))

          success=sum(1 for x in found.values() if x["status"]=="SUCCESS")
          print(f"QC_ENVELOPES={len(found)}")
          print(f"QC_SUCCESS={success}")
          print(f"QC_FAILED={len(found)-success}")

          for wid,obj in found.items():
              worker_dir=next((p.parent for p in root.rglob("result.json") if p.parent.name == wid), None)
              report=worker_dir / "result.md" if worker_dir else None

              if obj["status"]=="SUCCESS" and not obj.get("commit_sha"):
                  raise SystemExit(f"QC_FAIL: {wid} SUCCESS without commit_sha")
              if obj["status"]=="SUCCESS" and (report is None or not report.is_file()):
                  raise SystemExit(f"QC_FAIL: successful worker {wid} missing report artifact")

              if report and report.is_file():
                  dest=repo / ".kilo" / "team" / "results" / wid / "result.md"
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(report, dest)

              if obj["status"]=="SUCCESS":
                  branch=obj.get("branch","")
                  commit=obj.get("commit_sha","")
                  start=obj.get("start_sha","")
                  if not branch or not commit or not start:
                      raise SystemExit(f"QC_FAIL: {wid} missing branch/commit/start provenance")
                  subprocess.check_call(["git","fetch","origin",branch])
                  subprocess.check_call(["git","merge-base","--is-ancestor",start,commit])
                  patch=subprocess.check_output(["git","diff",f"{start}...origin/{branch}"],text=True)
                  patch_path=repo / ".kilo" / "team" / "results" / wid / "worker.patch"
                  patch_path.parent.mkdir(parents=True, exist_ok=True)
                  patch_path.write_text(patch,encoding="utf-8")
                  changed=subprocess.check_output(["git","diff","--name-only",f"{start}...origin/{branch}"],text=True)
                  (patch_path.parent/"changed-files.txt").write_text(changed,encoding="utf-8")

          if success == 0:
              raise SystemExit("QC_FAIL: zero successful workers")
          if success != len(found):
              raise SystemExit(
                  "QC_FAIL: fail-closed wave policy — one or more leased workers failed; "
                  "recover/reverify the failed lease before team integration"
              )

          print(f"QC_WORKSPACE_REPORTS={success}")
          PY

      - name: Install OpenCode for independent semantic QC
        shell: bash
        run: |
          set -euo pipefail
          install_ok=0
          for attempt in 1 2 3; do
            echo "QC_OPENCODE_INSTALL_ATTEMPT=${attempt}"
            if curl -fsSL https://opencode.ai/install | bash && "$HOME/.opencode/bin/opencode" --version; then
              install_ok=1
              break
            fi
            echo "QC_OPENCODE_INSTALL_FAILED_ATTEMPT=${attempt}"
            test "${attempt}" -lt 3 && sleep 5
          done
          test "${install_ok}" -eq 1
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Bind independent QC model/provider route
        shell: bash
        env:
          QUALIFIED_CANDIDATES: ${{ needs.model-qualification.outputs.candidates }}
          LEASE_IDS: ${{ needs.prepare.outputs.lease_ids }}
        run: |
          set -euo pipefail
          test -n "${QUALIFIED_CANDIDATES}"
          python3 - "${QUALIFIED_CANDIDATES}" "${LEASE_IDS}" "${RUNNER_TEMP}/team-results" <<'PY'
          import json, pathlib, sys, os

          candidates=[x for x in sys.argv[1].split("|") if x]
          expected=json.loads(sys.argv[2])
          root=pathlib.Path(sys.argv[3])

          worker_models=[]
          worker_providers=set()
          for p in root.rglob("result.json"):
              try:
                  obj=json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if obj.get("worker_id") not in expected:
                  continue
              model=str(obj.get("model") or "")
              if model:
                  worker_models.append(model)
                  worker_providers.add(model.split("/",1)[0] if "/" in model else model)

          preferred=[
              model for model in candidates
              if model not in worker_models
              and (model.split("/",1)[0] if "/" in model else model) not in worker_providers
          ]
          fallback=[model for model in candidates if model not in worker_models]

          route=[]
          for model in preferred+fallback+candidates:
              if model not in route:
                  route.append(model)

          if not route:
              raise SystemExit("BLOCKED_FREE_MODEL_UNAVAILABLE: no independent QC candidate")

          diversity="TRUE" if preferred else "DEGRADED"
          print("QC_MODEL_PROVIDER_DIVERSITY="+diversity)
          print("QC_MODEL_CANDIDATES="+"|".join(route[:3]))
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              out.write("QC_MODEL_CANDIDATES="+"|".join(route[:3])+"\\n")
          PY


      - name: Preflight OpenCode CLI for QC
        shell: bash
        run: |
          set -euo pipefail
          opencode run --help > "${RUNNER_TEMP}/qc-opencode-run-help.txt" 2>&1
          grep -q -- "--model" "${RUNNER_TEMP}/qc-opencode-run-help.txt"
          grep -q -- "--agent" "${RUNNER_TEMP}/qc-opencode-run-help.txt"
          grep -q -- "--auto" "${RUNNER_TEMP}/qc-opencode-run-help.txt"
          echo "QC OpenCode CLI contract preflight: PASS"
      - name: Independent semantic QC
        shell: bash
        run: |
          set -euo pipefail
          PROMPT="${RUNNER_TEMP}/qc-prompt.md"
          cat > "${PROMPT}" <<'EOF'
          You are the independent Quality Controller for a HooshyarOS autonomous team wave.

          You are READ-ONLY. Do not edit files and do not run shell commands.

          Inspect:
          - Docs/HOOSHYAROS_MASTER_CHARTER.md
          - Docs/HOOSHYAROS_GOVERNANCE_CHARTER.md
          - Docs/ARCHITECTURE.md
          - .kilo/plans/ACTIVE-AUTONOMOUS-INTELLIGENCE-QUALITY-PRODUCT-EVOLUTION-MISSION.md
          - .kilo/team/TEAM-WORKER-V1-PROTOCOL.md
          - the CURRENT leased worker result directory under .kilo/team/results/<current-lease-id>/result.md
          - the CURRENT leased worker patch under .kilo/team/results/<current-lease-id>/worker.patch
          - the CURRENT leased changed-files.txt
          Historical result directories under .kilo/team/results/* are context only. They are not current-wave outputs and MUST NOT be required to contain worker.patch/changed-files artifacts.

          Independently determine whether the successful CURRENT-WAVE worker outputs and actual changes are:
          - within their assigned scope;
          - evidence-backed rather than model assertions;
          - non-duplicative;
          - consistent with current repository state;
          - consistent with Architecture Freeze V4/V4.1;
          - explicit about unknowns and blocked items;
          - suitable inputs to the Team Synthesizer.
          - the current lease IDs are provided by LEASE_IDS at runtime. Evaluate only those current-wave outputs for acceptance.
          - the actual patch MUST corroborate the worker report; a report alone is never sufficient.

          Reject false-green evidence, fabricated claims, unsupported completion claims, or contradictions that were silently ignored.

          Your final response MUST contain exactly one line:
          QC_DECISION=PASS
          or
          QC_DECISION=FAIL
          Then provide concise reasons.
          EOF

          LOG="${RUNNER_TEMP}/team-semantic-qc.log"
          status=1
          IFS='|' read -r -a CANDIDATES <<< "${QC_MODEL_CANDIDATES}"
          attempt_no=0
          for candidate in "${CANDIDATES[@]}"; do
            attempt_no=$((attempt_no+1))
            ATTEMPT_LOG="${RUNNER_TEMP}/qc-attempt-${attempt_no}.log"
            : > "${ATTEMPT_LOG}"
            echo "QC_MODEL_ATTEMPT=${candidate}" | tee -a "${LOG}"
            if timeout --signal=TERM --kill-after=30s 12m opencode run --auto --agent plan --model "${candidate}" "$(cat "${PROMPT}")" 2>&1 | tee "${ATTEMPT_LOG}" | tee -a "${LOG}"; then
              if grep -q "^QC_DECISION=PASS$" "${ATTEMPT_LOG}" && ! grep -q "^QC_DECISION=FAIL$" "${ATTEMPT_LOG}"; then
                status=0
                echo "QC_FINAL_DECISION=PASS" | tee -a "${LOG}"
                break
              fi
            fi
          done
          if test "${status}" -ne 0; then
            echo "QC_FINAL_DECISION=FAIL" | tee -a "${LOG}"
            echo "TEAM_QC_STATUS=FAIL"
            tail -120 "${LOG}" || true
            exit 30
          fi
          echo "TEAM_QC_STATUS=PASS"
          tail -80 "${LOG}"

      - name: Persist independent QC adjudication
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          DECISION="FAIL"
          if test -f "${RUNNER_TEMP}/team-semantic-qc.log" && grep -q "^QC_FINAL_DECISION=PASS$" "${RUNNER_TEMP}/team-semantic-qc.log"; then DECISION="PASS"; fi
          export DECISION
          python3 - <<PY
          import hashlib, json, pathlib, os
          log=pathlib.Path("${RUNNER_TEMP}/team-semantic-qc.log")
          content=log.read_text(encoding="utf-8",errors="replace") if log.exists() else ""
          expected=json.loads("""${LEASE_IDS}""")
          inspections={}
          all_inspected=True
          for wid in expected:
              patch_path=pathlib.Path(".kilo/team/results")/wid/"worker.patch"
              changed_path=pathlib.Path(".kilo/team/results")/wid/"changed-files.txt"
              entry={"patch_sha256":"","patch_bytes":0,"changed_file_count":0,"actual_change_inspected":False}
              if patch_path.is_file() and changed_path.is_file():
                  data=patch_path.read_bytes()
                  changed=[x.strip() for x in changed_path.read_text(encoding="utf-8",errors="replace").splitlines() if x.strip()]
                  entry["patch_sha256"]=hashlib.sha256(data).hexdigest()
                  entry["patch_bytes"]=len(data)
                  entry["changed_file_count"]=len(changed)
                  entry["actual_change_inspected"]=bool(entry["patch_sha256"]) and entry["patch_bytes"] > 0 and entry["changed_file_count"] > 0
              inspections[wid]=entry
              all_inspected = all_inspected and entry["actual_change_inspected"]
          measured_decision = "PASS" if os.environ.get("DECISION")=="PASS" and all_inspected else "FAIL"
          reasons=[x.strip() for x in content.splitlines()[-80:] if x.strip() and not x.startswith(("QC_MODEL_ATTEMPT=","QC_DECISION="))]
          obj={
            "schema_version":"1.0",
            "run_id":int("${{ github.run_id }}"),
            "decision":measured_decision,
            "lease_ids":expected,
            "independence":"SEPARATE_QC_JOB_AND_SESSION",
            "actual_change_inspected":all_inspected,
            "lease_inspections":inspections,
            "reasons":reasons[-20:]
          }
          out=pathlib.Path("${RUNNER_TEMP}/team-qc-adjudication")
          out.mkdir(parents=True,exist_ok=True)
          (out/"qc-result.json").write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (out/"qc.log").write_text(content,encoding="utf-8")
          PY

      - name: Upload independent QC adjudication
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: team-qc-adjudication
          path: ${{ runner.temp }}/team-qc-adjudication/
          if-no-files-found: warn

  integrate:
    needs: [prepare, team-worker, quality-control]
    if: ${{ always() && needs.prepare.result == 'success' && needs.quality-control.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      actions: read
    env:
      TARGET_BRANCH: fix/autonomous-product-factory
      START_SHA: ${{ needs.prepare.outputs.start_sha }}
    steps:
      - name: Checkout immutable integration base
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.start_sha }}
          fetch-depth: 0

      - name: Download worker result artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: team-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/team-results


      - name: Download persisted QC adjudication
        uses: actions/download-artifact@v8
        with:
          name: team-qc-adjudication
          path: ${{ runner.temp }}/team-qc-adjudication

      - name: Require persisted independent QC PASS
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/team-qc-adjudication/qc-result.json"
          python3 - "${RUNNER_TEMP}/team-qc-adjudication/qc-result.json" <<PY
          import json,sys
          obj=json.load(open(sys.argv[1],encoding="utf-8"))
          if obj.get("decision")!="PASS":
              raise SystemExit(f"BLOCKED: persisted QC decision is {obj.get('decision')}")
          if not obj.get("actual_change_inspected"):
              raise SystemExit("BLOCKED: QC did not inspect actual worker changes")
          print("PERSISTED_QC=PASS")
          PY

      - name: Integrate independently verified worker commits
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RESULTS < <(find "${RUNNER_TEMP}/team-results" -name result.json -type f | sort)
          SUCCESS_COUNT=0
          : > "${RUNNER_TEMP}/integrated-workers.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "INTEGRATION_GIT_IDENTITY_CONFIGURED=TRUE"

          for file in "${RESULTS[@]}"; do
            WORKER_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["worker_id"])' "${file}")"
            STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "${file}")"
            COMMIT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit_sha"])' "${file}")"
            BRANCH="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["branch"])' "${file}")"
            START="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["start_sha"])' "${file}")"
            SCOPE="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["write_scope"]))' "${file}")"

            test "${START}" = "${START_SHA}" || exit 31

            if test "${STATUS}" != "SUCCESS"; then
              echo "ISOLATED_FAILURE=${WORKER_ID}"
              continue
            fi

            test -n "${COMMIT}"
            git fetch origin "${BRANCH}"
            git merge-base --is-ancestor "${START_SHA}" "${COMMIT}"
            git merge-base --is-ancestor "${COMMIT}" "origin/${BRANCH}"

            while IFS= read -r path; do
              test -n "${path}" || continue
              python3 - "${path}" "${SCOPE}" <<'PY'
          import json,sys
          path=sys.argv[1].replace("\\","/")
          scopes=json.loads(sys.argv[2])
          def covered(p,s):
              s=s.replace("\\","/").lstrip("./"); p=p.lstrip("./")
              return p.startswith(s.split("*",1)[0]) if "*" in s else (p==s.rstrip("/") or p.startswith(s.rstrip("/")+"/"))
          if not any(covered(path,s) for s in scopes):
              raise SystemExit(f"BLOCKED: integrated out-of-scope path {path}")
          PY
            done < <(git diff --name-only "${START_SHA}...origin/${BRANCH}")

            git cherry-pick "${COMMIT}"
            SUCCESS_COUNT=$((SUCCESS_COUNT+1))
            printf "%s\t%s\n" "${WORKER_ID}" "${COMMIT}" >> "${RUNNER_TEMP}/integrated-workers.txt"
            echo "INTEGRATED=${WORKER_ID} ${COMMIT}"
          done

          python3 - "${RUNNER_TEMP}/integrated-workers.txt" <<PY
          import json,sys,re
          from datetime import datetime, timezone
          from pathlib import Path
          registry_path=Path(".kilo/team/memory/work-registry.json")
          registry=json.loads(registry_path.read_text(encoding="utf-8"))
          by_id={str(x.get("id")):x for x in registry.get("items",[])}
          run_id=int("${{ github.run_id }}")
          rows=[line.rstrip("\n").split("\t",1) for line in open(sys.argv[1],encoding="utf-8") if line.strip()]
          for worker_id,commit in rows:
              m=re.match(r"^work-([0-9]{4})(?:-|$)",worker_id)
              if not m: raise SystemExit(f"BLOCKED: invalid integrated worker id {worker_id}")
              work_id=f"WORK-{m.group(1)}"
              item=by_id.get(work_id)
              if not item: raise SystemExit(f"BLOCKED: promoted worker has no registry row {work_id}")
              attempts=item.get("execution_attempts",[])
              matches=[a for a in attempts if int(a.get("run_id",-1))==run_id and str(a.get("state","")).upper()=="RESERVED_EXECUTING"]
              if len(matches)!=1: raise SystemExit(f"BLOCKED: promotion reservation missing/ambiguous for {work_id}")
              a=matches[0]
              a.update({"promoted":True,"state":"PROMOTED","promoted_commit":commit,"promotion_run_id":run_id,"promoted_at":datetime.now(timezone.utc).isoformat()})
              item["status"]="PROMOTED"
              item["readiness"]="PROMOTED"
              item["last_state_change_by"]=f"TEAM_INTEGRATOR_PROMOTION_{run_id}"
              for r in item.get("reservations",[]):
                  if int(r.get("run_id",-1))==run_id and str(r.get("lease_id"))==worker_id:
                      r["state"]="PROMOTED"; r["promoted_commit"]=commit
          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("PROMOTED_LEASE_STATE=FINALIZED")
          PY

          git add ".kilo/team/memory/work-registry.json"
          git commit -m "governance(team): finalize promoted lease registry state"

          echo "SUCCESS_COUNT=${SUCCESS_COUNT}"
          test "${SUCCESS_COUNT}" -gt 0
          git diff --check

      - name: Reconcile target before promotion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          CURRENT_TARGET_SHA="$(git rev-parse "origin/${TARGET_BRANCH}")"
          test "${CURRENT_TARGET_SHA}" = "${START_SHA}" || {
            echo "BLOCKED: target branch changed during team wave"
            exit 32
          }

      - name: Promote integrated team wave
        shell: bash
        run: |
          set -euo pipefail
          INTEGRATION_SHA="$(git rev-parse HEAD)"
          test "${INTEGRATION_SHA}" != "${START_SHA}"
          git push origin "${INTEGRATION_SHA}:refs/heads/${TARGET_BRANCH}"
          echo "TEAM_INTEGRATED_SHA=${INTEGRATION_SHA}"

  synthesize:
    needs: [integrate, model-qualification]
    if: ${{ success() && needs.model-qualification.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      TARGET_BRANCH: fix/autonomous-product-factory
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout latest integrated target
        uses: actions/checkout@v6
        with:
          ref: fix/autonomous-product-factory
          fetch-depth: 0
          persist-credentials: true

      - name: Capture synthesis start and isolate branch
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          SHA="$(git rev-parse "origin/${TARGET_BRANCH}")"
          echo "start_sha=${SHA}" >> "${GITHUB_OUTPUT}"
          git checkout -b "opencode/team-synthesis-${GITHUB_RUN_ID}" "${SHA}"
          test "$(git rev-parse HEAD)" = "${SHA}"
          test -z "$(git status --porcelain)"

      - name: Install OpenCode for synthesis
        shell: bash
        run: |
          set -euo pipefail
          install_ok=0
          for attempt in 1 2 3; do
            echo "SYNTH_OPENCODE_INSTALL_ATTEMPT=${attempt}"
            if curl -fsSL https://opencode.ai/install | bash && "$HOME/.opencode/bin/opencode" --version; then
              install_ok=1
              break
            fi
            echo "SYNTH_OPENCODE_INSTALL_FAILED_ATTEMPT=${attempt}"
            test "${attempt}" -lt 3 && sleep 5
          done
          test "${install_ok}" -eq 1
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Load qualified synthesis model pool
        shell: bash
        env:
          QUALIFIED_CANDIDATES: ${{ needs.model-qualification.outputs.candidates }}
        run: |
          set -euo pipefail
          test -n "${QUALIFIED_CANDIDATES}"
          IFS='|' read -r -a MODELS <<< "${QUALIFIED_CANDIDATES}"
          COUNT="${#MODELS[@]}"
          SYNTH_CANDIDATES=""
          for idx in 2 3 0 1; do
            if test "${idx}" -lt "${COUNT}"; then
              if test -z "${SYNTH_CANDIDATES}"; then
                SYNTH_CANDIDATES="${MODELS[idx]}"
              else
                SYNTH_CANDIDATES="${SYNTH_CANDIDATES}|${MODELS[idx]}"
              fi
            fi
          done
          test -n "${SYNTH_CANDIDATES}"
          echo "SYNTH_MODEL_CANDIDATES=${SYNTH_CANDIDATES}" >> "${GITHUB_ENV}"
          echo "SYNTH_MODEL_POLICY=qualified-pool-role-diversity"
          echo "SYNTH_MODEL_CANDIDATES=${SYNTH_CANDIDATES}"

      - name: Preflight OpenCode CLI for synthesis
        shell: bash
        run: |
          set -euo pipefail
          opencode run --help > "${RUNNER_TEMP}/synth-opencode-run-help.txt" 2>&1
          grep -q -- "--model" "${RUNNER_TEMP}/synth-opencode-run-help.txt"
          grep -q -- "--auto" "${RUNNER_TEMP}/synth-opencode-run-help.txt"
          echo "Synthesis OpenCode CLI contract preflight: PASS"
      - name: Synthesize current wave and create next governed plan
        shell: bash
        run: |
          set -euo pipefail
          PROMPT="${RUNNER_TEMP}/team-synthesis-prompt.md"
          cat > "${PROMPT}" <<'EOF'
          You are the governed HooshyarOS Team Orchestrator/Synthesizer.

          Read:
          - Docs/HOOSHYAROS_MASTER_CHARTER.md
          - Docs/HOOSHYAROS_GOVERNANCE_CHARTER.md
          - Docs/ARCHITECTURE.md
          - Docs/OPENCODE_EXECUTION_OPERATOR_CONTRACT.md
          - .kilo/plans/ACTIVE-AUTONOMOUS-INTELLIGENCE-QUALITY-PRODUCT-EVOLUTION-MISSION.md
          - .kilo/team/TEAM-WORKER-V1-PROTOCOL.md
          - .kilo/team/TEAM-ORGANIZATION-V2.json
          - .kilo/team/TEAM-ORGANIZATION-V2-PROTOCOL.md
          - .kilo/team/memory/mission-state.json
          - .kilo/team/memory/work-registry.json
          - .kilo/team/memory/evidence-registry.json
          - .kilo/team/memory/decision-registry.json
          - .kilo/team/memory/defect-registry.json
          - .kilo/team/memory/blocker-registry.json
          - .kilo/team/memory/commit-registry.json
          - .kilo/team/memory/wave-history.json
          - .kilo/team/NEXT-WAVE-PLAN.schema.json
          - every .kilo/team/results/*/result.md

          Your job is to turn the completed wave into an evidence-backed next-wave plan.

          REQUIREMENTS:
          1. Reconcile all worker reports against the current repository.
          2. Preserve contradictions and explicitly resolve or mark them BLOCKED.
          3. Identify work that is already completed; never reassign it as new work.
          4. Reconcile every candidate lease against .kilo/team/memory/work-registry.json and reject duplicate/terminal work.
          5. Derive the next dependency-ready Micro-Stage(s).
          6. Build .kilo/team/NEXT-WAVE-PLAN.json using the schema.
          7. Each lease must have:
             id, role, focus, owner, mode, write_scope.
          7. Each lease write_scope MUST include its own .kilo/team/results/<id>/ evidence root.
          8. Implementation leases must specify the exact product files/directories they are allowed to modify.
          9. No lease may touch protected architecture/governance/control-plane paths.
          10. Do not create duplicate engines or duplicate owners.
          11. Do not implement product changes in this synthesis step.
          12. Update ONLY:
              - .kilo/plans/ACTIVE-AUTONOMOUS-INTELLIGENCE-QUALITY-PRODUCT-EVOLUTION-MISSION.md
              - .kilo/team/NEXT-WAVE-PLAN.json
          13. Keep MISSION_STATUS = ACTIVE while safe next work exists.
          14. Set CONTINUE_ALLOWED = TRUE only when NEXT-WAVE-PLAN wave_status = READY.
          15. Set NEXT-WAVE-PLAN wave_status = COMPLETE or BLOCKED when there is no safe next work.
          16. Keep the next plan finite and dependency-aware. It may contain up to 100 leases, but only independent work belongs in the same wave.
          17. Use the order VALUE × RISK × DEPENDENCY × READINESS × SPEED.
          18. Never fabricate DeepSeek/Claude comparisons, financial values, runtime evidence or completion.

          Add a dated TEAM_WAVE_SYNTHESIS section to the mission file with:
          WAVE_ID
          WORKERS_COMPLETED
          WORKERS_BLOCKED
          KEY_FINDINGS
          CONTRADICTIONS
          OVERLAPS
          DEPENDENCY_ORDER
          NEXT_MICRO_STAGES
          EVIDENCE_PATHS
          QC_STATUS
          CONTINUE_DECISION

          Create exactly ONE coherent synthesis commit containing only the two allowed files.
          Stop after the commit.
          EOF

          status=1
          IFS='|' read -r -a CANDIDATES <<< "${SYNTH_MODEL_CANDIDATES}"
          LOG="${RUNNER_TEMP}/team-synth.log"
          : > "${LOG}"

          for candidate in "${CANDIDATES[@]}"; do
            echo "SYNTH_MODEL_ATTEMPT=${candidate}" | tee -a "${LOG}"
            if timeout --signal=TERM --kill-after=30s 20m opencode run --auto --model "${candidate}" "$(cat "${PROMPT}")" 2>&1 | tee -a "${LOG}"; then
              echo "SYNTH_MODEL_SELECTED=${candidate}" | tee -a "${LOG}"
              status=0
              echo "SYNTH_MODEL=${candidate}" >> "${GITHUB_ENV}"
              break
            fi
          done
          test "${status}" -eq 0

      - name: Validate next-wave plan and synthesis commit
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.state.outputs.start_sha }}"
          AHEAD="$(git rev-list --count "${BASE}..HEAD")"
          test "${AHEAD}" -eq 1 || {
            echo "BLOCKED: synthesis commit count = ${AHEAD}, expected 1"
            exit 33
          }

          CHANGED="$(git diff --name-only "${BASE}...HEAD")"
          EXPECTED=$'.kilo/plans/ACTIVE-AUTONOMOUS-INTELLIGENCE-QUALITY-PRODUCT-EVOLUTION-MISSION.md\n.kilo/team/NEXT-WAVE-PLAN.json'
          test "${CHANGED}" = "${EXPECTED}" || {
            echo "BLOCKED: synthesis changed paths are not exactly the two governed files"
            printf '%s\n' "${CHANGED}"
            exit 34
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          plan=json.loads(Path(".kilo/team/NEXT-WAVE-PLAN.json").read_text(encoding="utf-8"))
          schema=json.loads(Path(".kilo/team/NEXT-WAVE-PLAN.schema.json").read_text(encoding="utf-8"))

          if plan.get("schema_version") != "1.0":
              raise SystemExit("BLOCKED: invalid plan schema_version")
          status=plan.get("wave_status")
          if status not in {"READY","BLOCKED","COMPLETE","NOT_READY"}:
              raise SystemExit("BLOCKED: invalid wave_status")

          leases=plan.get("leases",[])
          if len(leases)>100:
              raise SystemExit("BLOCKED: more than 100 leases")
          ids=set()

          protected=(".github/","Docs/ARCHITECTURE.md","Docs/HOOSHYAROS_MASTER_CHARTER.md",
                      "Docs/HOOSHYAROS_GOVERNANCE_CHARTER.md","Assistant/SYSTEM_PROMPT.md",
                      "package.json","package-lock.json",".env")

          def pref(s):
              s=s.lstrip("./")
              return s.split("*",1)[0].rstrip("/")

          def overlap(a,b):
              aa,bb=pref(a),pref(b)
              return aa==bb or aa.startswith(bb+"/") or bb.startswith(aa+"/")

          for lease in leases:
              for key in ("id","role","focus","owner","mode","write_scope"):
                  if not lease.get(key):
                      raise SystemExit(f"BLOCKED: missing {key} in lease")
              lid=lease["id"]
              if lid in ids:
                  raise SystemExit(f"BLOCKED: duplicate lease {lid}")
              ids.add(lid)
              if lease["mode"] not in {"AUDIT","IMPLEMENT","REVIEW","VERIFY"}:
                  raise SystemExit(f"BLOCKED: invalid mode for {lid}")
              scope=lease["write_scope"]
              result_root=f".kilo/team/results/{lid}/"
              if result_root not in scope:
                  raise SystemExit(f"BLOCKED: {lid} missing evidence root")
              for s in scope:
                  n=s.lstrip("./")
                  if any(n==p.rstrip("/") or n.startswith(p) for p in protected):
                      raise SystemExit(f"BLOCKED: {lid} touches protected path {s}")

          ready_ids=[x["id"] for x in leases]
          if status=="READY" and not ready_ids:
              raise SystemExit("BLOCKED: READY plan has no leases")

          # Prevent the new plan from becoming another copy of the initial 12-seat audit wave.
          initial=json.loads(Path(".kilo/team/TEAM-WORKER-V1.json").read_text(encoding="utf-8"))
          initial_ids={x["id"] for x in initial["workers"]}
          if status=="READY" and initial_ids and set(ready_ids).issubset(initial_ids):
              raise SystemExit("BLOCKED: next plan repeats only the initial audit worker IDs")

          # No overlapping writes inside a single ready wave.
          ready=leases if status=="READY" else []
          for i,a in enumerate(ready):
              for b in ready[i+1:]:
                  for sa in a["write_scope"]:
                      for sb in b["write_scope"]:
                          if overlap(sa,sb):
                              raise SystemExit(f"BLOCKED: write-scope overlap {a['id']}:{sa} <-> {b['id']}:{sb}")

          mission=Path(".kilo/plans/ACTIVE-AUTONOMOUS-INTELLIGENCE-QUALITY-PRODUCT-EVOLUTION-MISSION.md").read_text(encoding="utf-8")
          if status=="READY":
              if "MISSION_STATUS = ACTIVE" not in mission or "CONTINUE_ALLOWED = TRUE" not in mission:
                  raise SystemExit("BLOCKED: READY plan conflicts with mission continuation state")
          print(f"NEXT_WAVE_STATUS={status}")
          print(f"NEXT_WAVE_LEASES={len(leases)}")
          PY

      - name: Promote synthesis state
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.state.outputs.start_sha }}"
          git fetch origin "${TARGET_BRANCH}"
          CURRENT_TARGET_SHA="$(git rev-parse "origin/${TARGET_BRANCH}")"
          test "${CURRENT_TARGET_SHA}" = "${BASE}" || {
            echo "BLOCKED: target drifted during synthesis"
            exit 35
          }
          git merge-base --is-ancestor "${BASE}" HEAD
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "SYNTHESIS_PROMOTED=$(git rev-parse HEAD)"

      - name: Publish continuation decision only
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          PLAN=.kilo/team/NEXT-WAVE-PLAN.json
          MISSION=.kilo/plans/ACTIVE-AUTONOMOUS-INTELLIGENCE-QUALITY-PRODUCT-EVOLUTION-MISSION.md
          if test -f "${PLAN}" && grep -q '"wave_status": "READY"' "${PLAN}" && grep -Fxq 'MISSION_STATUS = ACTIVE' "${MISSION}" && grep -q 'CONTINUE_ALLOWED = TRUE' "${MISSION}"; then
            echo "TEAM_CONTINUE_READY=TRUE"
          else
            echo "TEAM_CONTINUE_READY=FALSE"
          fi

      - name: Publish team wave summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          PLAN=.kilo/team/NEXT-WAVE-PLAN.json
          STATUS="$(python3 -c 'import json; print(json.load(open("'"$PLAN"'"))["wave_status"])' 2>/dev/null || echo UNKNOWN)"
          MODEL="${SYNTH_MODEL:-unknown}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/122/comments" \
            -f body="HooshyarOS Team Wave #${GITHUB_RUN_ID}: synthesis=${STATUS}; synthesis_model=${MODEL}; next-wave auto-continuation depends on governed plan state."
          true

      - name: Final team synthesis evidence
        if: always()
        shell: bash
        run: |
          echo "TEAM_RUN_ID=${GITHUB_RUN_ID}"
          echo "TEAM_SYNTHESIS_MODEL=${SYNTH_MODEL:-unknown}"
          if test -f "${RUNNER_TEMP}/team-synth.log"; then
            tail -100 "${RUNNER_TEMP}/team-synth.log"
          fi
