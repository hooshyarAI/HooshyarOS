name: OpenCode Write Smoke Test (Sandbox)

on:
  issue_comment:
    types: [created]

jobs:
  write-smoke:
    if: >
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'OpenCode Write Smoke Test (EXPERIMENT)' &&
      (contains(github.event.comment.body, '/oc-write') || contains(github.event.comment.body, '/opencode-write'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout isolated sandbox branch
        uses: actions/checkout@v6
        with:
          ref: experiment/opencode-write-sandbox
          fetch-depth: 1
          persist-credentials: true

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          prompt: |
            BOUNDED WRITE EXPERIMENT ONLY.
            Read AGENTS.md first and obey the experimental sandbox exception.
            You may modify ONLY __opencode_sandbox__/result.txt.
            Create exactly that one file and write the following content exactly:
            EXPERIMENT=OpenCode write capability
            MEASURED_RESULT=PASS
            WORKER=OpenCode
            SCOPE=__opencode_sandbox__/result.txt
            Do not modify any other path.
            Do not alter Architecture, governance, product code, tests, documentation, workflows, or package files.
            After creating result.txt, run a read-only verification that the file exists and contains the required five lines.
            Then create a branch/commit and open a PR if the GitHub permissions permit it, but do not make any further file changes.
          use_github_token: true
