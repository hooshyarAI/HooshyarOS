name: HooshyarOS Team Wave Continuation

on:
  workflow_run:
    workflows: ["HooshyarOS Autonomous Team Worker"]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: hooshyaros-team-wave-continuation
  cancel-in-progress: true

jobs:
  continue:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/team-dispatch-authority.yml
    with:
      reason: Post-completion governed Team V2 continuation via single authority
    secrets: inherit
