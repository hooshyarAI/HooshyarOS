name: HooshyarOS Team Wave Continuation

on:
  workflow_dispatch: # manual-only while cloud Team V2 is paused

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: hooshyaros-team-wave-continuation
  cancel-in-progress: true

jobs:
  continue:
    if: ${{ false }} # SECURITY_HOLD: automatic Team V2 continuation paused pending review
    uses: ./.github/workflows/team-dispatch-authority.yml
    with:
      reason: Post-completion governed Team V2 continuation via single authority
    secrets: inherit
