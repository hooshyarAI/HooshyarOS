name: HooshyarOS Autonomous Construction Launcher

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: hooshyaros-autonomous-construction-launcher
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch the canonical construction authority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run autonomous-platform-construction.yml --ref main
