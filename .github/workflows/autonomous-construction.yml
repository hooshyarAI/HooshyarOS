name: HooshyarOS Autonomous Construction

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hooshyaros-autonomous-construction
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  construct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "hooshyarAI autonomous builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip pytest

      - name: Run autonomous construction loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run autonomous:build
