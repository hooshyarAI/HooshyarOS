name: HooshyarOS Team Stop Alert

on:
  workflow_run:
    workflows: ["HooshyarOS Autonomous Team Worker"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  alert:
    if: ${{ false }} # SECURITY_HOLD: side-effecting team automation paused pending review
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'cancelled' ||
          github.event.workflow_run.conclusion == 'timed_out' ||
          github.event.workflow_run.conclusion == 'startup_failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Publish immediate stop escalation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

          BODY="@hooshyarAI 🚨 **HooshyarOS Team V2 STOP/BLOCK ALERT**

          **Run:** ${RUN_ID}
          **Workflow:** HooshyarOS Autonomous Team Worker
          **Conclusion:** ${CONCLUSION}
          **Branch/Event ref:** ${BRANCH}
          **When:** ${{ github.event.workflow_run.updated_at }}

          Execution has stopped at workflow level. Inspect the run immediately:
          ${URL}

          This alert is informational and must not be interpreted as completion. Recovery remains Manager/Mission-Director owned; preserve evidence and do not start a duplicate Team V2 wave."

          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/122/comments" -f body="${BODY}"
