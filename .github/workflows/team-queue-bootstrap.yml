name: HooshyarOS Team Queue Bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/team-queue-bootstrap.yml
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency:
  group: hooshyaros-team-queue-bootstrap
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  bootstrap:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.issue.number == 122 && startsWith(github.event.comment.body, '/team-queue-bootstrap')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEAM_WORKER_WORKFLOW_ID: "378094136"
    steps:
      - name: Manager — Cancel obsolete active runs
        shell: bash
        run: |
          set -euo pipefail
          echo "BOOTSTRAP_RUN_ID=${GITHUB_RUN_ID}"
          python3 - <<'PY' > "${RUNNER_TEMP}/workflows.txt"
import json, subprocess, os
legacy={"Final Product Factory","Final Product Factory Trigger","Autonomous CI Repair","Autonomous Builder","Autonomous Builder Audit","Autonomous Builder Verification","Autonomous Builder Validation","HooshyarOS Validation","Hooshyar Validation","HooshyarOS CI","HooshyarOS Release Artifacts","Android Release Verification","Autonomous Platform Construction","Autonomous Continuation Validation","HooshyarOS Autonomous Continuation Validation","Web Product Acceptance"}
raw=subprocess.check_output(["gh","api",f"repos/{os.environ[\"GITHUB_REPOSITORY\"]}/actions/workflows?per_page=100"],text=True)
data=json.loads(raw)
for w in data.get("workflows",[]):
    if w.get("name") in legacy or str(w.get("id"))=="378094136":
        print(w["id"], w["name"])
PY
          total=0
          while read -r wf_id wf_name; do
            for status in queued in_progress waiting requested pending action_required; do
              gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf_id}/runs?status=${status}&per_page=100" > "${RUNNER_TEMP}/runs.json" || true
              python3 - "${RUNNER_TEMP}/runs.json" <<'PYRUN' > "${RUNNER_TEMP}/cancel.txt"
import json,sys
pages=json.load(open(sys.argv[1],encoding="utf-8"))
runs=pages if isinstance(pages,list) else [pages]
for p in runs:
  for r in p.get("workflow_runs",[]):
    print(r["id"],r.get("name",""),r.get("head_branch",""),r.get("status",""))
PYRUN
              while read -r id name branch st; do
                [ -n "${id}" ] || continue
                [ "${id}" = "${GITHUB_RUN_ID}" ] && continue
                cancel=0
                if [ "${name}" = "HooshyarOS Autonomous Team Worker" ] && [ "${branch}" != "fix/autonomous-product-factory" ]; then cancel=1; fi
                case "${name}" in
                  "Final Product Factory"|"Final Product Factory Trigger"|"Autonomous CI Repair"|"Autonomous Builder"|"Autonomous Builder Audit"|"Autonomous Builder Verification"|"Autonomous Builder Validation"|"HooshyarOS Validation"|"Hooshyar Validation"|"HooshyarOS CI"|"HooshyarOS Release Artifacts"|"Android Release Verification"|"Autonomous Platform Construction"|"Autonomous Continuation Validation"|"HooshyarOS Autonomous Continuation Validation"|"Web Product Acceptance") [ "${branch}" = "main" ] || [ "${branch}" = "fix/autonomous-product-factory" ] && cancel=1 ;;
                esac
                if [ "${cancel}" = "1" ]; then
                  echo "CANCEL_REQUEST=${id} ${name} ${branch} ${st}"
                  if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null 2>&1; then
                    total=$((total+1))
                  fi
                fi
              done < "${RUNNER_TEMP}/cancel.txt"
            done
          done < "${RUNNER_TEMP}/workflows.txt"
          echo "CANCEL_REQUESTS=${total}"
      - name: Manager — Dispatch only when no Team Worker is active
        shell: bash
        run: |
          set -euo pipefail
          active="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TEAM_WORKER_WORKFLOW_ID}/runs?branch=fix/autonomous-product-factory&status=in_progress&per_page=20" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("workflow_runs",[])))')"
          echo "ACTIVE_TEAM_WORKERS=${active}"
          if [ "${active}" -gt 0 ]; then
            echo "TEAM_WORKER_DISPATCH=REFUSED_ACTIVE_RUN"
            gh issue comment 122 --repo "${GITHUB_REPOSITORY}" --body "TEAM QUEUE BOOTSTRAP: refused duplicate dispatch because an active Team Worker already exists. No running wave was cancelled."
            exit 20
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${TEAM_WORKER_WORKFLOW_ID}/dispatches"             -f ref=main             -f 'inputs[reason]=Queue bootstrap governed dispatch via main control plane'
          echo "TEAM_WORKER_DISPATCH=SUCCESS"

      - name: Manager — Record evidence
        shell: bash
        run: |
          gh issue comment 122 --repo "${GITHUB_REPOSITORY}"             --body "TEAM QUEUE BOOTSTRAP COMPLETE: manager cancelled obsolete legacy/stale Team Worker runs and dispatched exactly one fresh governed Team V2 wave. Bootstrap=${GITHUB_RUN_ID}."
