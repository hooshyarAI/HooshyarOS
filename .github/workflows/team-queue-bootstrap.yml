name: HooshyarOS Team Queue Bootstrap

on:
  issue_comment:
    types: [created]

concurrency:
  group: hooshyaros-team-queue-bootstrap
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  bootstrap:
    if: ${{ github.event.issue.pull_request == null && github.event.issue.number == 122 && startsWith(github.event.comment.body, '/team-queue-bootstrap') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEAM_WORKER_WORKFLOW_ID: "378094136"
    steps:
      - name: Manager — Cancel obsolete runs
        shell: bash
        run: |
          set -euo pipefail
          echo "BOOTSTRAP_RUN_ID=${GITHUB_RUN_ID}"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > "${RUNNER_TEMP}/runs.json"
          python3 - "${RUNNER_TEMP}/runs.json" <<'PY' > "${RUNNER_TEMP}/cancel.txt"
          import json, os, sys
          pages=json.load(open(sys.argv[1], encoding="utf-8"))
          runs=[r for p in pages for r in p.get("workflow_runs",[])]
          legacy={"Final Product Factory","Final Product Factory Trigger","Autonomous CI Repair","Autonomous Builder Audit","Autonomous Builder Verification","Autonomous Builder Validation","HooshyarOS Validation","HooshyarOS CI","HooshyarOS Release Artifacts","Android Release Verification","Autonomous Platform Construction","HooshyarOS Autonomous Continuation Validation","Web Product Acceptance"}
          current=os.environ["GITHUB_RUN_ID"]; tw=os.environ["TEAM_WORKER_WORKFLOW_ID"]
          for r in runs:
              if str(r.get("id"))==current: continue
              st=r.get("status")
              if st not in {"queued","pending","in_progress","waiting","requested","action_required"}: continue
              legacy_hit=r.get("name") in legacy and r.get("head_branch") in {"main","fix/autonomous-product-factory"}
              team_hit=str(r.get("workflow_id"))==tw
              if legacy_hit or team_hit: print(r["id"])
          PY
          n=0
          while read -r id; do
            [ -n "$id" ] || continue
            n=$((n+1))
            echo "CANCEL_REQUEST=$id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 ||               gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null 2>&1 || true
          done < "${RUNNER_TEMP}/cancel.txt"
          echo "CANCEL_REQUESTS=$n"

      - name: Manager — Dispatch one fresh Team V2 wave
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${TEAM_WORKER_WORKFLOW_ID}/dispatches"             -f ref=main             -f 'inputs[max_parallel]=12'             -f 'inputs[reason]=manager bootstrap recovery after queue storm'
          echo "TEAM_WORKER_DISPATCH=SUCCESS"

      - name: Manager — Record evidence
        shell: bash
        run: |
          gh issue comment 122 --repo "${GITHUB_REPOSITORY}"             --body "TEAM QUEUE BOOTSTRAP COMPLETE: manager cancelled obsolete legacy/stale Team Worker runs and dispatched exactly one fresh governed Team V2 wave. Bootstrap=${GITHUB_RUN_ID}."
