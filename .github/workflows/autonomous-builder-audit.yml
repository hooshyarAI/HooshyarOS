name: Autonomous Builder Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  autonomous-builder-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run autonomous builder tests
        run: python -m pytest Backend/AI_Runtime/tests/test_autonomous_builder_platform.py -q
      - name: Compile autonomous builder
        run: python -m py_compile Backend/AI_Runtime/autonomous_builder.py
