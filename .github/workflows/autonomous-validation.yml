name: Autonomous Builder Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-autonomous-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Python test dependencies
        run: python -m pip install -U pytest
      - name: Install locked Node dependencies
        run: npm ci
      - name: Capture current npm vulnerability report
        run: |
          mkdir -p .hooshyar
          npm audit --json > .hooshyar/npm-audit.json || true
          node -e "try { const r = JSON.parse(require('node:fs').readFileSync('.hooshyar/npm-audit.json','utf8')); console.log(JSON.stringify({type:'NPM_AUDIT_SUMMARY',vulnerabilities:r.metadata?.vulnerabilities ?? null,hasError:Boolean(r.error)}, null, 2)); } catch (e) { console.log(JSON.stringify({type:'NPM_AUDIT_SUMMARY',reportParsed:false,error:e.message})); }"
      - name: Run autonomous builder tests
        run: python -m pytest Backend/AI_Runtime/tests/test_autonomous_builder_platform.py -q
      - name: Run executable product factory acceptance and full Jest gate
        run: npm run product:factory
        env:
          HOOSHYAR_FACTORY_ALLOW_PUSH: "0"
      - name: Type-check TypeScript project
        run: npx tsc --noEmit
      - name: Run real HTTP web product acceptance
        run: npm run product:web:acceptance
      - name: Run real browser UI acceptance
        run: npm run product:web:browser:acceptance
      - name: Run tenant isolation and unauthenticated-access acceptance
        if: always()
        run: npm run product:security:acceptance
      - name: Upload commit-bound product acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hooshyar-acceptance-evidence
          path: |
            .hooshyar/factory-success.json
            .hooshyar/factory-failure.json
            .hooshyar/web-acceptance-success.json
            .hooshyar/security-acceptance-success.json
            .hooshyar/web-browser-acceptance.json
            .hooshyar/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
