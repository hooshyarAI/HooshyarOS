name: Autonomous Builder Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-autonomous-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install -U pytest
      - name: Run autonomous builder tests
        run: python -m pytest Backend/AI_Runtime/tests/test_autonomous_builder_platform.py -q
      - name: Install locked Node dependencies
        run: npm ci
      - name: Run TypeScript autonomous tests
        run: node ./node_modules/jest/bin/jest.js --runInBand Backend/HBOS
