name: HooshyarOS Worker Stop Notification

on:
  workflow_run:
    workflows:
      - HooshyarOS Continuous OpenCode Worker
      - HooshyarOS Autonomous Team Worker
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notify-stop:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    env:
      CONTROL_ISSUE: "122"
      CONTROL_TITLE: "HooshyarOS Continuous Worker Control"
      TARGET_BRANCH: "fix/autonomous-product-factory"
      RESTART_COMMAND: "/opencode-team-run"
      ALERT_EMAIL: ${{ secrets.HOOSHYAROS_ALERT_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.HOOSHYAROS_ALERT_FROM }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Build stop report
        id: report
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="${{ github.event.workflow_run.id }}"
          RUN_NUMBER="${{ github.event.workflow_run.run_number }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"

          {
            echo "HOOSHYAROS_WORKER_STOPPED=TRUE"
            echo "RUN_ID=${RUN_ID}"
            echo "RUN_NUMBER=${RUN_NUMBER}"
            echo "CONCLUSION=${CONCLUSION}"
            echo "WORKFLOW_NAME=${WORKFLOW_NAME}"
            echo "HEAD_SHA=${HEAD_SHA}"
            echo "RUN_URL=${RUN_URL}"
          } >> "${GITHUB_ENV}"

          cat > "${RUNNER_TEMP}/stop-report.txt" <<EOF
HooshyarOS Autonomous Worker متوقف شد.

Workflow: ${WORKFLOW_NAME}
Run: #${RUN_NUMBER}
Conclusion: ${CONCLUSION}
Run ID: ${RUN_ID}
Head SHA: ${HEAD_SHA}
Target branch: ${TARGET_BRANCH}

جزئیات اجرا:
${RUN_URL}

علت دقیق توقف را در همان Run و بخش Failed/Cancelled steps بررسی کنید.

برای ادامه دستی کارمند:
در Issue #${CONTROL_ISSUE} با عنوان "${CONTROL_TITLE}" یک کامنت جدید ایجاد کنید که ابتدای آن دقیقاً این باشد:
 ${RESTART_COMMAND}

این اعلان نباید خودش کارمند را دوباره اجرا کند؛ شروع مجدد فقط با فرمان دستی بالا انجام می‌شود.
EOF

      - name: Notify control issue
        shell: bash
        run: |
          set -euo pipefail

          BODY="$(cat "${RUNNER_TEMP}/stop-report.txt")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="${BODY}"

      - name: Send direct email when configured
        if: ${{ env.RESEND_API_KEY != '' && env.ALERT_EMAIL != '' && env.RESEND_FROM_EMAIL != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          SUBJECT="HooshyarOS — تیم/کارمند خودکار متوقف شد (Run #${RUN_NUMBER})"
          BODY="$(cat "${RUNNER_TEMP}/stop-report.txt")"

          payload="$(jq -n \
            --arg from "${RESEND_FROM_EMAIL}" \
            --arg to "${ALERT_EMAIL}" \
            --arg subject "${SUBJECT}" \
            --arg text "${BODY}" \
            '{from:$from,to:[$to],subject:$subject,text:$text}')"

          curl -fsS https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "${payload}"

      - name: Record notification mode
        if: always()
        shell: bash
        run: |
          if test -n "${RESEND_API_KEY}" && test -n "${ALERT_EMAIL}" && test -n "${RESEND_FROM_EMAIL}"; then
            echo "DIRECT_EMAIL=CONFIGURED"
          else
            echo "DIRECT_EMAIL=NOT_CONFIGURED"
            echo "GitHub control-issue notification remains the active stop-alert fallback."
          fi
