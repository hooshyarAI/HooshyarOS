name: HooshyarOS Team Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_job:
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    if: ${{ false }} # SECURITY_HOLD: side-effecting team automation paused pending review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      CONTROL_ISSUE: "122"
      ALERT_EMAIL: ${{ secrets.HOOSHYAROS_ALERT_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.HOOSHYAROS_ALERT_FROM }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Inspect latest team runs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, subprocess, time
          from datetime import datetime, timezone

          raw = subprocess.check_output([
              "gh","api",
              "repos/hooshyarAI/HooshyarOS/actions/runs?per_page=100"
          ], text=True)
          runs = json.loads(raw)["workflow_runs"]

          team = [
              r for r in runs
              if r.get("name") == "HooshyarOS Autonomous Team Worker"
              and r.get("path") == ".github/workflows/hooshyaros-team-worker.yml"
          ]

          if not team:
              print("WATCHDOG_STATE=NO_TEAM_RUN")
              raise SystemExit(0)

          team.sort(key=lambda r: r.get("created_at") or "", reverse=True)
          latest = team[0]

          created = datetime.fromisoformat(latest["created_at"].replace("Z","+00:00"))
          age_minutes = (datetime.now(timezone.utc)-created).total_seconds()/60.0

          alert = False
          alert_type = ""

          if latest.get("status") == "completed" and latest.get("conclusion") not in ("success","skipped","neutral"):
              alert = True
              alert_type = "STOPPED"
          elif latest.get("status") in ("queued","pending","waiting","requested") and age_minutes >= 30:
              alert = True
              alert_type = "STALLED"
          elif latest.get("status") == "in_progress" and age_minutes >= 80:
              alert = True
              alert_type = "LONG_RUNNING"

          state = {
              "run_id": latest["id"],
              "run_number": latest["run_number"],
              "status": latest.get("status"),
              "conclusion": latest.get("conclusion"),
              "created_at": latest.get("created_at"),
              "age_minutes": round(age_minutes,1),
              "html_url": latest.get("html_url"),
              "head_sha": latest.get("head_sha"),
              "alert": alert,
              "alert_type": alert_type
          }

          open(os.environ["GITHUB_ENV"],"a").write(
              "WATCHDOG_RUN="+json.dumps(state,separators=(",",":"))+"\n"
          )
          print(json.dumps(state,indent=2))
          PY

      - name: Deduplicate watchdog alert
        if: ${{ env.WATCHDOG_RUN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          state=json.loads(os.environ["WATCHDOG_RUN"])
          if not state["alert"]:
              print("ALERT_NEEDED=FALSE")
              open(os.environ["GITHUB_ENV"],"a").write("ALERT_NEEDED=FALSE\n")
              raise SystemExit(0)

          comments=subprocess.check_output([
              "gh","api",
              "repos/hooshyarAI/HooshyarOS/issues/122/comments?per_page=100"
          ], text=True)
          marker=f"Run #{state['run_number']} ({state['run_id']})"
          already=marker in comments

          print(f"ALERT_NEEDED={'FALSE' if already else 'TRUE'}")
          open(os.environ["GITHUB_ENV"],"a").write(
              f"ALERT_NEEDED={'FALSE' if already else 'TRUE'}\n"
          )
          PY

      - name: Publish watchdog alert to control issue
        if: ${{ env.ALERT_NEEDED == 'TRUE' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          s=json.loads(os.environ["WATCHDOG_RUN"])
          kind=s["alert_type"]

          if kind=="STOPPED":
              opening="HooshyarOS Team Worker متوقف شد."
              cause=f"Conclusion: {s['conclusion']}"
          elif kind=="LONG_RUNNING":
              opening="HooshyarOS Team Worker اجرای طولانی دارد و به آستانه هشدار نزدیک شده است."
              cause=f"Current status: {s['status']}; age: {s['age_minutes']} minutes"
          else:
              opening="HooshyarOS Team Worker بیش از ۳۰ دقیقه در صف مانده است."
              cause=f"Current status: {s['status']}; age: {s['age_minutes']} minutes"

          body=f"""{opening}

Run #{s['run_number']} ({s['run_id']})
{cause}
Target branch: fix/autonomous-product-factory
Head SHA: {s['head_sha']}

Run:
{s['html_url']}

برای شروع مجدد کنترل‌شده:
`/opencode-team-run`

این هشدار فقط بعد از تشخیص واقعی توقف/گیرکردن ایجاد می‌شود و خودش Run جدید ایجاد نمی‌کند.
"""
          subprocess.run([
              "gh","api","--method","POST",
              "repos/hooshyarAI/HooshyarOS/issues/122/comments",
              "-f",f"body={body}"
          ],check=True)
          open(os.environ["RUNNER_TEMP"]+"/watchdog-body.txt","w",encoding="utf-8").write(body)
          PY

      - name: Send direct email when configured
        if: ${{ env.ALERT_NEEDED == 'TRUE' && env.RESEND_API_KEY != '' && env.ALERT_EMAIL != '' && env.RESEND_FROM_EMAIL != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(cat "${RUNNER_TEMP}/watchdog-body.txt")"
          python3 - <<'PY'
          import json, os, subprocess
          body=open(os.environ["RUNNER_TEMP"]+"/watchdog-body.txt",encoding="utf-8").read()
          state=json.loads(os.environ["WATCHDOG_RUN"])
          subject=f"HooshyarOS — Team Worker {state['alert_type']} — Run #{state['run_number']}"
          payload=json.dumps({
              "from":os.environ["RESEND_FROM_EMAIL"],
              "to":[os.environ["ALERT_EMAIL"]],
              "subject":subject,
              "text":body
          })
          subprocess.run([
              "curl","-fsS","https://api.resend.com/emails",
              "-H","Authorization: Bearer "+os.environ["RESEND_API_KEY"],
              "-H","Content-Type: application/json",
              "--data",payload
          ],check=True)
          PY

      - name: Final watchdog state
        if: always()
        shell: bash
        run: |
          echo "WATCHDOG_RUN=${WATCHDOG_RUN:-unknown}"
          echo "ALERT_NEEDED=${ALERT_NEEDED:-unknown}"

  worker-job-watchdog:
    if: ${{ false }} # SECURITY_HOLD: worker-job alert side effects paused pending review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      CONTROL_ISSUE: "122"
      ALERT_EMAIL: ${{ secrets.HOOSHYAROS_ALERT_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.HOOSHYAROS_ALERT_FROM }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Build immediate worker-stop alert
        shell: bash
        run: |
          set -euo pipefail
          JOB_ID="${{ github.event.workflow_job.id }}"
          JOB_NAME="${{ github.event.workflow_job.name }}"
          CONCLUSION="${{ github.event.workflow_job.conclusion }}"
          RUN_ID="${{ github.event.workflow_job.run_id }}"
          URL="${{ github.event.workflow_job.html_url }}"
          SHA="${{ github.event.workflow_job.head_sha }}"
          body="$(cat <<EOF
HooshyarOS — یک Worker تیمی متوقف شد.

Worker: ${JOB_NAME}
Job ID: ${JOB_ID}
Run ID: ${RUN_ID}
Conclusion: ${CONCLUSION}
Head SHA: ${SHA}

جزئیات:
${URL}

این Worker از بقیه Workerها ایزوله است؛ توقف آن به‌تنهایی کل Wave را متوقف نمی‌کند.

برای شروع Wave/ادامه‌ی کنترل‌شده:
/opencode-team-run
EOF
          )"
          printf '%s\n' "${body}" > "${RUNNER_TEMP}/worker-stop-alert.txt"
          echo "WORKER_STOP_ALERT=TRUE" >> "${GITHUB_ENV}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" -f body="${body}"

      - name: Send immediate worker-stop email when configured
        if: ${{ env.WORKER_STOP_ALERT == 'TRUE' && env.RESEND_API_KEY != '' && env.ALERT_EMAIL != '' && env.RESEND_FROM_EMAIL != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          body=open(os.environ["RUNNER_TEMP"]+"/worker-stop-alert.txt",encoding="utf-8").read()
          payload=json.dumps({
              "from":os.environ["RESEND_FROM_EMAIL"],
              "to":[os.environ["ALERT_EMAIL"]],
              "subject":"HooshyarOS — توقف یک Worker تیمی",
              "text":body
          })
          subprocess.run([
              "curl","-fsS","https://api.resend.com/emails",
              "-H","Authorization: Bearer "+os.environ["RESEND_API_KEY"],
              "-H","Content-Type: application/json",
              "--data",payload
          ],check=True)
          PY
