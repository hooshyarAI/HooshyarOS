name: HooshyarOS Team V2 Control Plane Validation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/team-v2-dispatch-authority.cjs'
      - 'scripts/team-v2-dispatch-authority.test.cjs'
      - 'scripts/lib/team-v2-*.cjs'
      - '.github/workflows/team-*.yml'
      - '.github/workflows/hooshyaros-team-worker.yml'
      - '.kilo/team/NEXT-WAVE-PLAN.schema.json'
      - '.github/workflows/team-v2-control-plane-validation.yml'

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Syntax check
        run: |
          set -euo pipefail
          node --check scripts/lib/team-v2-gate.cjs
          node --check scripts/lib/team-v2-admission.cjs
          node --check scripts/lib/team-v2-authorization.cjs
          node --check scripts/lib/team-v2-reservation.cjs
          node --check scripts/team-v2-dispatch-authority.cjs
      - name: Pure control-plane tests
        run: |
          set -euo pipefail
          node scripts/lib/team-v2-gate.test.cjs
          node scripts/lib/team-v2-admission.test.cjs
          node scripts/lib/team-v2-authorization.test.cjs
          node scripts/lib/team-v2-reservation.test.cjs
          node scripts/team-v2-acceptance-verify.test.cjs
          node scripts/team-v2-dispatch-authority.test.cjs
      - name: Real negative admission against current target
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/autonomous-product-factory
          TEAM_CONTROL_ISSUE: "122"
          TEAM_WORKER_WORKFLOW_ID: "378094136"
        run: |
          set +e
          node scripts/team-v2-dispatch-authority.cjs > "${RUNNER_TEMP}/negative-admission.txt" 2>&1
          rc=$?
          set -e
          cat "${RUNNER_TEMP}/negative-admission.txt"
          test "${rc}" -eq 20
          grep -q 'ACCEPTANCE_AUTHORIZATION_REQUIRED' "${RUNNER_TEMP}/negative-admission.txt"
          ! grep -q 'TEAM_RESERVATION_CREATED=' "${RUNNER_TEMP}/negative-admission.txt"
          echo "REAL_NEGATIVE_ADMISSION=PASS"

      - name: Worker route contract audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/hooshyaros-team-worker.yml').read_text(encoding='utf-8')
          required=['reservation_id','reservation_ref','WORK_TASK_CLASS','task_class_for','TEAM_RESERVATION_ID','TEAM_RESERVATION_REF']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('MISSING_WORKER_CONTROL_CONTRACT=' + ','.join(missing))
          forbidden=['MODEL_ROUTING_TASK_CLASS=mode','MODEL_ROUTING_TASK_CLASS=" + mode','MODEL_ROUTING_TASK_CLASS=' + '${mode}']
          bad=[x for x in forbidden if x in text]
          if bad:
              raise SystemExit('FORBIDDEN_MODE_AUTHORITY=' + ','.join(bad))
          print('WORKER_ROUTE_CONTRACT=PASS')
          PY
      - name: Acceptance signing key presence
        env:
          SIGNING_SECRET: ${{ secrets.TEAM_AUTHORIZATION_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          if test -n "${SIGNING_SECRET}"; then echo "ACCEPTANCE_SIGNING_SECRET_PRESENT=TRUE"; else echo "ACCEPTANCE_SIGNING_SECRET_PRESENT=FALSE"; fi

      - name: Acceptance gate invariant
        run: |
          set -euo pipefail
          git fetch origin fix/autonomous-product-factory
          python3 - <<'PY'
          import json, subprocess
          raw=subprocess.check_output(['git','show','origin/fix/autonomous-product-factory:.kilo/team/TEAM-V2-ACCEPTANCE-GATE.json'],text=True)
          gate=json.loads(raw)
          if gate.get('status')!='ARMED' or gate.get('hold_after_pass') is not True:
              raise SystemExit('ACCEPTANCE_GATE_INVARIANT_FAILED')
          print('ACCEPTANCE_GATE=ARMED_HOLD')
          PY