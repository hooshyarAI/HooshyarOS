name: HooshyarOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: TypeScript verification
        run: >-
          npx tsc
          Backend/HBOS/Autonomous/Runtime/LocalConstructionToolset.ts
          --noEmit --target ES2022 --module Node16 --moduleResolution Node16
          --esModuleInterop --skipLibCheck --pretty false

      - name: Commercial artifact quality gate
        run: >-
          node ./node_modules/jest/bin/jest.js --runInBand
          Backend/HBOS/test/CommercialArtifactQualityAudit.test.ts
          Backend/HBOS/test/CommercialProductCompletionAudit.test.ts
          Backend/HBOS/Factory/Quality/QualityGate.test.ts

      - name: Focused autonomous tests
        run: >-
          node ./node_modules/jest/bin/jest.js --runInBand
          Backend/HBOS/test/AutonomousProjectMission.test.ts
          Backend/HBOS/test/AutonomousProjectMission.platform-order.test.ts
          Backend/HBOS/test/AutonomousPlatformWeaving.test.ts
          Backend/HBOS/test/AutonomousCompletionGate.test.ts
          Backend/HBOS/test/AutonomousBuildDaemon.test.ts

      - name: Full Jest suite
        run: node ./node_modules/jest/bin/jest.js --runInBand
