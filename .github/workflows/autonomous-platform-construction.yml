name: HooshyarOS Autonomous Platform Construction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construct:
    # The first human/repository push starts the autonomous run. Commits made
    # by the daemon itself must not recursively start another daemon run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
        continue-on-error: true

      - name: Run governed autonomous construction
        env:
          CI: true
          HOOSHYAR_AGENT: python
        run: npx tsx Backend/HBOS/Autonomous/Runtime/AutonomousBuildDaemon.ts

      - name: Final repository state
        if: always()
        run: |
          git status --short
          git log -5 --oneline
