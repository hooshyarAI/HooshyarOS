name: HooshyarOS Autonomous Platform Construction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hooshyaros-autonomous-construction-main
  cancel-in-progress: false

jobs:
  construct:
    # The daemon itself commits and pushes each completed capability. Those
    # bot-originated pushes must not recursively create another daemon run;
    # the daemon continues its governed cycle loop inside this job.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies when declared
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "No root requirements.txt; autonomous builder dependencies are already repository-local."
          fi

      - name: Run governed autonomous construction to completion
        env:
          CI: true
          HOOSHYAR_AGENT: python
        run: npx tsx Backend/HBOS/Autonomous/Runtime/AutonomousBuildDaemon.ts

      - name: Final repository state
        if: always()
        run: |
          git status --short
          git log -8 --oneline
