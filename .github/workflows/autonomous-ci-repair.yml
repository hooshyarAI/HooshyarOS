name: Autonomous CI Repair

on:
  workflow_run:
    workflows: ["Final Product Factory"]
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  autonomous-ci-repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.head_branch != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout failed PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm install

      - name: Install Kilo Code CLI
        run: npm install --global @kilocode/cli

      - name: Execute autonomous repair loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOOSHYAR_GITHUB_REPOSITORY: ${{ github.repository }}
          HOOSHYAR_TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          HOOSHYAR_TARGET_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HOOSHYAR_AGENT: kilo
          HOOSHYAR_AUTONOMOUS_ALLOW_PUSH: "1"
          KILO_CONFIG_CONTENT: '{"model":"kilo/kilo-auto/free"}'
          HOOSHYAR_CI_REPAIR_MAX_ATTEMPTS: "3"
        run: node scripts/autonomous-ci-repair-runner.cjs
