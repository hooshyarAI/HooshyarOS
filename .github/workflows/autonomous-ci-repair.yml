on:
  pull_request:
    branches: [main, fix/autonomous-product-factory]
    types: [opened, reopened, synchronize]
  push:
    branches: [fix/qualification-runner-fail-closed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: hooshyaros-autonomous-ci-repair-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  authorize_repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      opted_in: ${{ steps.authorization.outputs.opted_in }}
      repair_drill: ${{ steps.authorization.outputs.repair_drill }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify authorization against the live pull request
        id: authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          if ! curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --get \
            --data-urlencode "state=open" \
            --data-urlencode "head=${OWNER}:${SOURCE_BRANCH}" \
            --data-urlencode "per_page=100" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -o /tmp/hooshyar-open-prs.json; then
            echo "opted_in=false" >> "${GITHUB_OUTPUT}"
            echo "repair_drill=false" >> "${GITHUB_OUTPUT}"
            echo "CI repair not authorized: no verifiable open PR for this source branch."
            exit 0
          fi
          AUTH_RESULT=$(REPO="${REPO}" SOURCE_BRANCH="${SOURCE_BRANCH}" node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              let prs = [];
              try { prs = JSON.parse(data); } catch {}
              const pr = (Array.isArray(prs) ? prs : []).find(item =>
                item?.state === "open" &&
                item?.head?.repo?.full_name === process.env.REPO &&
                item?.head?.ref === process.env.SOURCE_BRANCH &&
                (item?.base?.ref === "main" ||
                  (item?.base?.ref === "fix/autonomous-product-factory" &&
                   String(item?.body || "").includes("ci-repair-opt-in: true")))
              );
              const optedIn = Boolean(pr);
              const repairDrill = Boolean(pr &&
                pr.base?.ref === "fix/autonomous-product-factory" &&
                String(pr.body || "").includes("ci-repair-opt-in: true"));
              process.stdout.write((optedIn ? "true" : "false") + " " + (repairDrill ? "true" : "false"));
            });
          ' < /tmp/hooshyar-open-prs.json)
          read -r OPTED_IN REPAIR_DRILL <<< "${AUTH_RESULT}"
          echo "opted_in=${OPTED_IN}" >> "${GITHUB_OUTPUT}"
          echo "repair_drill=${REPAIR_DRILL}" >> "${GITHUB_OUTPUT}"
          echo "CI_REPAIR_AUTHORIZATION=${OPTED_IN} REPAIR_DRILL=${REPAIR_DRILL}"

  autonomous-ci-repair:
    needs: authorize_repair
    if: needs.authorize_repair.outputs.opted_in == 'true'
    permissions:
      contents: write
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout autonomous branch
      - name: Checkout autonomous branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm install

      - name: Install Kilo Code CLI
        run: npm install --global @kilocode/cli

      - name: Wait for Final Product Factory result for this SHA
        id: wait-for-factory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            RUN_INFO=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/final-product-factory.yml/runs?per_page=20" \
              | HEAD_SHA="${HEAD_SHA}" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const sha=process.env.HEAD_SHA;const r=(j.workflow_runs||[]).filter(x=>x.head_sha===sha).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];process.stdout.write(r?`${r.id} ${r.status} ${r.conclusion||""}`:"NONE")})')
            echo "Final Product Factory: ${RUN_INFO}"
            if [ "${RUN_INFO}" != "NONE" ]; then
              read -r RUN_ID RUN_STATUS RUN_CONCLUSION <<< "${RUN_INFO}"
              if [ "${RUN_STATUS}" = "completed" ]; then
                echo "target_run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
                echo "factory_conclusion=${RUN_CONCLUSION}" >> "${GITHUB_OUTPUT}"
                if [ "${RUN_CONCLUSION}" = "failure" ]; then
                  if FAILED_JOBS_JSON=$(curl -fsSL \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                    | jq -c '[.jobs[]? | select(.conclusion=="failure") | .name]'); then
                    REPAIR_NEEDED=$(FAILED_JOBS_JSON="${FAILED_JOBS_JSON}" node -e 'const {shouldLaunchRepair}=require("./scripts/autonomous-ci-repair-policy.cjs");let j;try{j=JSON.parse(process.env.FAILED_JOBS_JSON||"[]")}catch{j=null}process.stdout.write(shouldLaunchRepair(j)?"true":"false")')
                  else
                    FAILED_JOBS_JSON="[]"
                    REPAIR_NEEDED=true
                  fi
                  echo "failed_jobs=${FAILED_JOBS_JSON}" >> "${GITHUB_OUTPUT}"
                  echo "repair_needed=${REPAIR_NEEDED}" >> "${GITHUB_OUTPUT}"
                  if [ "${REPAIR_NEEDED}" = "false" ]; then
                    echo "Only evidence/release-gate jobs failed; avoid launching a duplicate repair while the first run publishes its artifact."
                  fi
                else
                  echo "repair_needed=false" >> "${GITHUB_OUTPUT}"
                fi
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Timed out waiting for Final Product Factory result"
          exit 1

      - name: Execute autonomous repair with Kilo
        if: steps.wait-for-factory.outputs.repair_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOOSHYAR_TARGET_RUN_ID: ${{ steps.wait-for-factory.outputs.target_run_id }}
          HOOSHYAR_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HOOSHYAR_TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HOOSHYAR_GITHUB_REPOSITORY: ${{ github.repository }}
          HOOSHYAR_CI_REPAIR_DRILL: ${{ needs.authorize_repair.outputs.repair_drill }}
          HOOSHYAR_AGENT: kilo
          HOOSHYAR_AUTONOMOUS_ALLOW_PUSH: "1"
          KILO_CONFIG_CONTENT: '{"model":"kilo-auto/free","agent":{"hooshyar-repair":{"model":"kilo/kilo-auto/free"}}}'
        run: node scripts/autonomous-ci-repair-runner.cjs

      - name: Report successful factory with no repair required
        if: steps.wait-for-factory.outputs.repair_needed == 'false' && steps.wait-for-factory.outputs.factory_conclusion == 'success'
        run: echo "Final Product Factory passed for this SHA; autonomous repair is not required."

      - name: Report evidence-gate-only blocker without duplicate repair
        if: steps.wait-for-factory.outputs.repair_needed == 'false' && steps.wait-for-factory.outputs.factory_conclusion == 'failure'
        run: echo "Only evidence/release-gate jobs failed; no duplicate repair will run while the originating repair workflow publishes its evidence artifact."
      - name: Upload verified autonomous repair evidence
        if: success() && steps.wait-for-factory.outputs.repair_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hooshyar-agent-repair-evidence
          path: ./.hooshyar/agent-repair-success.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch final qualification with repair evidence available
        if: success() && steps.wait-for-factory.outputs.repair_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref }}
          HOOSHYAR_CI_REPAIR_DRILL: ${{ needs.authorize_repair.outputs.repair_drill }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/final-product-factory.yml/dispatches" \
            -d "$(REF="${REF}" DRILL="${HOOSHYAR_CI_REPAIR_DRILL}" node -e 'const payload={ref:process.env.REF};if(process.env.DRILL==="true")payload.inputs={ci_repair_drill:true};process.stdout.write(JSON.stringify(payload))')"
