name: Autonomous CI Repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  autonomous-ci-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout autonomous branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm install

      - name: Install Kilo Code CLI
        run: npm install --global @kilocode/cli

      - name: Wait for Final Product Factory result for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            RUN_JSON=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/final-product-factory.yml/runs?per_page=20")
            STATUS=$(printf '%s' "$RUN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const sha=process.env.HEAD_SHA;const r=(j.workflow_runs||[]).filter(x=>x.head_sha===sha).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];console.log(r?`${r.id} ${r.status} ${r.conclusion||""}`:"NONE")})')
            echo "Final Product Factory: ${STATUS}"
            case "${STATUS}" in
              "NONE") ;;
              *" completed failure"|*" completed cancelled"|*" completed timed_out"|*" completed action_required") exit 0 ;;
              *" completed success") exit 0 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Final Product Factory result"
          exit 1

      - name: Execute autonomous CI repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOOSHYAR_GITHUB_REPOSITORY: ${{ github.repository }}
          HOOSHYAR_AGENT: kilo
          HOOSHYAR_AUTONOMOUS_ALLOW_PUSH: "1"
          KILO_CONFIG_CONTENT: '{"model":"kilo/kilo-auto/free"}'
          HOOSHYAR_CI_REPAIR_MAX_ATTEMPTS: "1"
        run: node scripts/autonomous-ci-repair-runner.cjs
