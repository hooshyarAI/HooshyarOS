name: Dependency cleanup candidate validation

on:
  push:
    branches:
      - chore/deprecated-zip-dependency-cleanup
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate-lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package-lock.json with npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exactly from the regenerated lockfile
        run: npm ci

      - name: Assert legacy ZIP dependency chain is removed
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const entries = Object.entries(lock.packages);
          const removed = entries
            .filter(([path]) => /node_modules\/(?:fstream|rimraf|inflight)$/.test(path))
            .map(([path, item]) => `${path}@${item.version}`);
          const oldGlob = entries
            .filter(([path, item]) => /node_modules\/glob$/.test(path) && /^7\./.test(item.version || ''))
            .map(([path, item]) => `${path}@${item.version}`);
          if (removed.length || oldGlob.length) {
            console.error({ removed, oldGlob });
            process.exit(1);
          }
          console.log('PASS: fstream/rimraf/inflight and glob 7 are absent from the resolved lockfile.');
          NODE

      - name: Run complete Jest suite
        run: npm test -- --runInBand

      - name: Commit only the npm-generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
          else
            git commit -m "chore(deps): regenerate lockfile for verified ZIP dependency updates"
            git push origin HEAD:chore/deprecated-zip-dependency-cleanup
          fi
