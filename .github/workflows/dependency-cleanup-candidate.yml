name: Remaining deprecation cleanup candidate

on:
  push:
    branches:
      - chore/deprecated-zip-dependency-cleanup
    paths:
      - package.json
      - .github/workflows/dependency-cleanup-candidate.yml

permissions:
  contents: write

jobs:
  regenerate-lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lock using npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from regenerated lock
        run: npm ci

      - name: Assert the lockfile has no declared deprecated packages
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const entries = Object.entries(lock.packages);
          const relevant = ['test-exclude', 'glob', 'fast-csv', 'fstream', 'rimraf', 'inflight', 'lodash.isequal'];
          const packageRows = entries
            .filter(([path]) => relevant.some(name => path.endsWith('node_modules/' + name)))
            .map(([path, item]) => ({ path, version: item.version, deprecated: item.deprecated || null }));
          const deprecated = entries
            .filter(([, item]) => Boolean(item.deprecated))
            .map(([path, item]) => ({ path, version: item.version, deprecated: item.deprecated }));
          console.log('RESOLVED_DEPENDENCY_EVIDENCE=' + JSON.stringify({ packageRows, deprecated }, null, 2));
          const blocked = deprecated.filter(item =>
            ['fstream', 'rimraf', 'inflight', 'lodash.isequal'].some(name => item.path.endsWith('node_modules/' + name))
          );
          if (blocked.length) {
            console.error('Deprecated ZIP/CSV packages remain: ' + JSON.stringify(blocked));
            process.exit(1);
          }
          console.log('PASS: deprecated ZIP and CSV packages are absent; full dependency inventory recorded above.');
          NODE

      - name: Run complete Jest suite
        run: npm test -- --runInBand

      - name: Commit only npm-generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
          else
            git commit -m "chore(deps): regenerate lock for current CSV and test-exclude"
            git push origin HEAD:chore/deprecated-zip-dependency-cleanup
          fi
