name: Remaining deprecation cleanup candidate

on:
  push:
    branches:
      - chore/deprecated-zip-dependency-cleanup
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate-lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lock using npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from regenerated lock
        run: npm ci

      - name: Verify archiver-utils glob sync compatibility
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const fixture = fs.mkdtempSync(path.join(os.tmpdir(), 'hooshyar-glob-'));
          try {
            fs.writeFileSync(path.join(fixture, 'proof.txt'), 'ok');
            const globApi = require('glob');
            assert.equal(typeof globApi.sync, 'function', 'glob.sync compatibility export must exist');
            const matches = require('archiver-utils').file.expand({ cwd: fixture }, ['*.txt']);
            assert(matches.some(file => file.replace(/\\\\/g, '/') === 'proof.txt'), 'archiver-utils must expand fixture glob');
            console.log('PASS: archiver-utils file.expand works with the resolved glob implementation.');
          } finally {
            fs.rmSync(fixture, { recursive: true, force: true });
          }
          NODE

      - name: Assert the lockfile has no declared deprecated packages
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const entries = Object.entries(lock.packages);
          const relevant = ['test-exclude', 'glob', 'fast-csv', 'fstream', 'rimraf', 'inflight', 'lodash.isequal'];
          const packageRows = entries
            .filter(([path]) => relevant.some(name => path.endsWith('node_modules/' + name)))
            .map(([path, item]) => ({ path, version: item.version, deprecated: item.deprecated || null }));
          const deprecated = entries
            .filter(([, item]) => Boolean(item.deprecated))
            .map(([path, item]) => ({ path, version: item.version, deprecated: item.deprecated }));
          console.log('RESOLVED_DEPENDENCY_EVIDENCE=' + JSON.stringify({ packageRows, deprecated }, null, 2));
          if (deprecated.length) {
            console.error('Deprecated packages remain: ' + JSON.stringify(deprecated, null, 2));
            process.exit(1);
          }
          console.log('PASS: package-lock.json has no declared deprecated packages.');
          NODE

      - name: Run complete Jest suite
        run: npm test -- --runInBand

      - name: Commit only npm-generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
          else
            git commit -m "chore(deps): regenerate lock for current CSV and test-exclude"
            git push origin HEAD:chore/deprecated-zip-dependency-cleanup
          fi
