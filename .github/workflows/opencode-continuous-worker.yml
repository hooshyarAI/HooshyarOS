name: HooshyarOS Continuous OpenCode Worker

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for a manual single-worker recovery run"
        required: false
        type: string

concurrency:
  group: hooshyaros-single-recovery
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  continuous-worker:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: fix/autonomous-product-factory
      MODEL_POLICY: adaptive-free
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout current target branch
        uses: actions/checkout@v6
        with:
          ref: fix/autonomous-product-factory
          fetch-depth: 0
          persist-credentials: true

      - name: Guard credentials and repository state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENCODE_API_KEY}" || { echo "BLOCKED_FREE_MODEL_UNAVAILABLE: OPENCODE_API_KEY is not configured"; exit 20; }
          git fetch origin "${TARGET_BRANCH}"
          START_SHA="$(git rev-parse "origin/${TARGET_BRANCH}")"
          git checkout -B "opencode/continuous-${GITHUB_RUN_ID}" "${START_SHA}"
          printf 'START_SHA=%s\n' "${START_SHA}" >> "${GITHUB_ENV}"
          printf 'WORKER_BRANCH=opencode/continuous-%s\n' "${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"
          git status --short

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "${GITHUB_PATH}"
          "$HOME/.opencode/bin/opencode" --version

      - name: Select best available free model
        shell: bash
        run: |
          set -euo pipefail
          CATALOG="${RUNNER_TEMP}/opencode-models-verbose.txt"
          "$HOME/.opencode/bin/opencode" models --refresh --verbose > "$CATALOG"
          python3 - "$CATALOG" <<'PY' > "${RUNNER_TEMP}/model-selection.env"
          import json
          import math
          import re
          import sys
          from datetime import datetime, timezone

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          lines = text.splitlines()
          decoder = json.JSONDecoder()
          models = []
          i = 0

          def is_model_id(s):
              return bool(re.fullmatch(r"[^\\s/]+/[^\\s]+", s))

          while i < len(lines):
              line = lines[i].strip()
              if is_model_id(line) and i + 1 < len(lines):
                  raw = "\\n".join(lines[i + 1:])
                  try:
                      obj, _ = decoder.raw_decode(raw.lstrip())
                  except Exception:
                      i += 1
                      continue
                  if isinstance(obj, dict) and "name" in obj:
                      models.append((line, obj))
              i += 1

          candidates = []
          now = datetime.now(timezone.utc)

          for model_id, m in models:
              cost = m.get("cost")
              provider, _, model_name = model_id.partition("/")
              explicit_free = False
              if isinstance(cost, dict):
                  numeric_costs = [v for v in cost.values() if isinstance(v, (int, float))]
                  explicit_free = bool(numeric_costs) and all(v == 0 for v in numeric_costs)
              free_named = model_id == "opencode/big-pickle" or model_name.lower().endswith("-free") or "-free-" in model_name.lower()
              if not (explicit_free or free_named):
                  continue

              if m.get("reasoning") is not True or m.get("tool_call") is not True:
                  continue

              limit = m.get("limit") or {}
              context = int(limit.get("context") or 0)
              output = int(limit.get("output") or 0)
              if context < 100_000 or output < 8_000:
                  continue

              score = 0.0
              score += 100 if m.get("reasoning") else 0
              score += 80 if m.get("tool_call") else 0
              score += 30 if m.get("structured_output") else 0
              score += min(30.0, math.log2(max(context, 1)) * 2.0)
              score += min(20.0, math.log2(max(output, 1)) * 1.5)
              if m.get("attachment"):
                  score += 5
              family = str(m.get("family") or "").lower()
              if any(x in family for x in ("mini", "small", "nano")):
                  score -= 8

              updated = m.get("last_updated") or m.get("release_date")
              if updated:
                  try:
                      dt = datetime.fromisoformat(str(updated).replace("Z", "+00:00"))
                      age_days = max(0.0, (now - dt).total_seconds() / 86400.0)
                      score += max(0.0, 10.0 - min(10.0, age_days / 30.0))
                  except Exception:
                      pass

              if model_id == "opencode/big-pickle":
                  score += 5  # verified HooshyarOS baseline
              candidates.append((score, model_id, context, output, m.get("name", model_id)))

          candidates.sort(reverse=True)
          top = candidates[:4]
          if not top:
              print("MODEL_SELECTION_STATUS=BLOCKED_FREE_MODEL_UNAVAILABLE")
              raise SystemExit(20)

          print("MODEL_SELECTION_STATUS=OK")
          print("SELECTED_MODEL=" + top[0][1])
          print("MODEL_CANDIDATES=" + "|".join(x[1] for x in top))
          print("MODEL_RANKING=" + " ; ".join(f"{x[1]} score={x[0]:.2f} ctx={x[2]} out={x[3]}" for x in top))
          PY
          cat "${RUNNER_TEMP}/model-selection.env" | tee -a "${GITHUB_ENV}"
          test "${MODEL_SELECTION_STATUS:-}" = "OK"
          echo "Adaptive free-model policy selected: ${SELECTED_MODEL}"

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Run one governed autonomous knot
        shell: bash
        run: |
          set -euo pipefail
          PROMPT_FILE="${RUNNER_TEMP}/opencode-continuous-prompt.md"
          cat > "${PROMPT_FILE}" <<'PROMPT'
          You are OpenCode, the governed remote execution operator for HooshyarOS.

          Before doing anything else, read these repository authorities in this order:
          1. Docs/HOOSHYAROS_MASTER_CHARTER.md
          2. Docs/HOOSHYAROS_GOVERNANCE_CHARTER.md
          3. Docs/ARCHITECTURE.md
          4. Assistant/SYSTEM_PROMPT.md
          5. Docs/OPENCODE_EXECUTION_OPERATOR_CONTRACT.md
          6. Docs/COMMERCIAL_PRODUCT_COMPLETION_CONTRACT.md
          7. AGENTS.md
          8. .kilo/plans/ACTIVE-AUTONOMOUS-INTELLIGENCE-QUALITY-PRODUCT-EVOLUTION-MISSION.md
          Then inspect current Git history, current HEAD, trusted checkpoints, relevant .kilo/evidence, .kilo/plans, Docs/Product/PRODUCT_CONSTRUCTION_ROADMAP.json, and the canonical commercialization queue/ledger.

          IMPORTANT CURRENT-STATE RULE:
          Repository state is authoritative. Historical checkpoints are evidence seeds only. Do not restart already verified F1/F6/CCC/UX work unless current evidence proves regression or invalidation. Reconcile stale or contradictory evidence before selecting new work.

          EXECUTION CONTRACT:
          - Work only on the current worker branch.
          - Exactly ONE primary knot per run.
          - If the active master mission exists and is ACTIVE, execute its next unfinished Micro-Stage. Do NOT select an unrelated generic backlog knot.
          - Select generic backlog work only after the active master mission is COMPLETE or terminally BLOCKED with no independent safe Micro-Stage.
          - Do not invent a parallel backlog or reorder the canonical backlog merely for convenience.
          - Preserve Architecture Freeze V4/V4.1 and all five canonical intelligence engines.
          - Reuse existing owners/providers before native implementation.
          - Keep change scope minimal and bounded.
          - Do not modify governance/architecture-control files, .github workflow files, package manifests/lockfiles, secrets, deployment configuration, or other control-plane files. If such a change is truly required, enter BLOCKED with evidence.
          - Do not force-push, reset hard, clean unrelated work, or delete history.
          - Do not push the branch yourself; the outer workflow owns publication.
          - Do not create a PR yourself; the outer workflow owns promotion.
          - Do not weaken, delete, skip, or rewrite tests merely to make them pass.
          - Run proportional focused verification for the knot, plus any integration verification required by its dependencies.
          - Record directly-required evidence for the knot.
          - Commit exactly ONE coherent verified change for the knot.
          - After one Micro-Stage commit, stop that worker invocation. The controller may automatically dispatch the next governed run.
          - Final response must clearly report: selected knot, owner engine, start SHA, changed paths, tests, verification, commit SHA, blockers, and next-state recommendation.

          ALLOWED UNATTENDED ACTIONS:
          repository audit, evidence reconciliation, routine implementation, standardization, bounded repair, focused tests, evidence creation, one commit.

          HARD BLOCK:
          architecture/governance changes, security or tenant-isolation boundary changes, product-scope invention, billing/subscription policy invention, destructive migrations, external production activation, secret handling, force-push/history rewrite, test weakening, protected control-plane edits, or unresolved contract contradictions.

          Return one of:
          ADVANCED / RECONCILED / BLOCKED / NO_SAFE_WORK / BLOCKED_FREE_MODEL_UNAVAILABLE.
          PROMPT

          OPENCODE_LOG="${RUNNER_TEMP}/opencode-worker.log"
          : > "${OPENCODE_LOG}"
          status=1
          IFS='|' read -r -a CANDIDATES <<< "${MODEL_CANDIDATES}"
          for candidate in "${CANDIDATES[@]}"; do
            echo "MODEL_ATTEMPT=${candidate}" | tee -a "${OPENCODE_LOG}"
            if timeout --signal=TERM --kill-after=30s 20m opencode run --auto --model "${candidate}" "$(cat "${PROMPT_FILE}")" 2>&1 | tee -a "${OPENCODE_LOG}"; then
              status=0
              echo "MODEL_SELECTED=${candidate}" | tee -a "${OPENCODE_LOG}"
              echo "MODEL=${candidate}" >> "${GITHUB_ENV}"
              break
            fi
            echo "MODEL_FAILED=${candidate}" | tee -a "${OPENCODE_LOG}"
          done
          test "${status}" -eq 0 || { echo "BLOCKED: all ranked free model candidates failed"; exit 24; }

      - name: Remove temporary prompt and validate worker diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain)" || { echo "BLOCKED: OpenCode left uncommitted changes"; exit 23; }
          git diff --check "origin/${TARGET_BRANCH}...HEAD"
          COMMITS_AHEAD="$(git rev-list --count "origin/${TARGET_BRANCH}..HEAD")"
          echo "COMMITS_AHEAD=${COMMITS_AHEAD}"
          test "${COMMITS_AHEAD}" -le 1

      - name: Apply change-scope firewall
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "origin/${TARGET_BRANCH}...HEAD" > changed-paths.txt
          echo "Changed paths:"
          cat changed-paths.txt

          if grep -Eq '^(AGENTS\.md|AUTONOMOUS_MISSION\.md|Docs/ARCHITECTURE\.md|Docs/HOOSHYAROS_MASTER_CHARTER\.md|Docs/HOOSHYAROS_GOVERNANCE_CHARTER\.md|Docs/HOOSHYAROS_TOOLCHAIN_OPTIMIZATION_LAW\.md|Docs/HOOSHYAROS_FINAL_DECISIONS_REGISTER\.md|Assistant/SYSTEM_PROMPT\.md|Docs/ARCHITECTURE_DECISIONS/|\.github/|package\.json$|package-lock\.json$|npm-shrinkwrap\.json$|\.env|.*\.pem$|.*\.key$|.*\.p12$)' changed-paths.txt; then
            echo "BLOCKED: protected/control-plane path changed"
            exit 21
          fi

      - name: Reconcile target and fast-forward promote
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          CURRENT_TARGET_SHA="$(git rev-parse "origin/${TARGET_BRANCH}")"
          echo "START_SHA=${START_SHA}"
          echo "CURRENT_TARGET_SHA=${CURRENT_TARGET_SHA}"
          test "${CURRENT_TARGET_SHA}" = "${START_SHA}" || {
            echo "BLOCKED: target branch changed during worker run"
            exit 22
          }

          WORKER_SHA="$(git rev-parse HEAD)"
          test "${WORKER_SHA}" != "${START_SHA}" || {
            echo "NO_SAFE_WORK: worker made no committed change"
            exit 0
          }

          git merge-base --is-ancestor "${START_SHA}" "${WORKER_SHA}"
          git push origin "${WORKER_SHA}:refs/heads/${WORKER_BRANCH}"
          git push origin "${WORKER_SHA}:refs/heads/${TARGET_BRANCH}"
          echo "ADVANCED: promoted ${WORKER_SHA} to ${TARGET_BRANCH}"

      - name: Auto-continue active master mission (single-worker fallback only)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          PLAN=.kilo/plans/ACTIVE-AUTONOMOUS-INTELLIGENCE-QUALITY-PRODUCT-EVOLUTION-MISSION.md
          TEAM_MANIFEST=.kilo/team/TEAM-WORKER-V1.json
          TEAM_READY=FALSE
          if test -f "$TEAM_MANIFEST" && grep -q '"status": "READY_MANUAL"' "$TEAM_MANIFEST"; then
            TEAM_READY=TRUE
          fi
          if test "$TEAM_READY" = "TRUE"; then
            echo "TEAM_WORKER_V1_READY=TRUE"
            echo "Single-worker auto-continuation is suppressed while Team Worker V1 is ready."
            exit 0
          fi
          if test -f "$PLAN" && grep -Fxq 'MISSION_STATUS = ACTIVE' "$PLAN" && grep -Fxq 'CONTINUE_ALLOWED = TRUE' "$PLAN"; then
            echo "ACTIVE_MASTER_MISSION=TRUE"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/opencode-continuous-worker.yml/dispatches" \
              -f ref=main \
              -f 'inputs[reason]=Automatic continuation of active HooshyarOS master mission'
          else
            echo "ACTIVE_MASTER_MISSION=FALSE_OR_STOPPED"
          fi

      - name: Final evidence summary
        if: always()
        shell: bash
        run: |
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "TARGET_BRANCH=${TARGET_BRANCH}"
          echo "MODEL_POLICY=${MODEL_POLICY}"
          echo "MODEL=${MODEL:-unknown}"
          echo "MODEL_CANDIDATES=${MODEL_CANDIDATES:-unknown}"
          echo "START_SHA=${START_SHA:-unknown}"
          echo "WORKER_BRANCH=${WORKER_BRANCH:-unknown}"
          if test -f "${RUNNER_TEMP}/opencode-worker.log"; then
            echo "OpenCode final lines:"
            tail -80 "${RUNNER_TEMP}/opencode-worker.log" || true
          fi
