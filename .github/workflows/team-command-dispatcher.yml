name: HooshyarOS Team Command Dispatcher

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: hooshyaros-team-command-dispatcher
  cancel-in-progress: true

jobs:
  parse-command:
    if: ${{ false }} # SECURITY_HOLD: team command dispatcher paused pending review
    runs-on: ubuntu-slim
    outputs:
      acceptance_authorization_id: ${{ steps.parse.outputs.acceptance_authorization_id }}
    steps:
      - id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          AUTH=""
          if printf '%s\n' "${COMMENT_BODY}" | grep -Eq '(^|[[:space:]])acceptance=[A-Za-z0-9._-]+'; then
            AUTH="$(printf '%s\n' "${COMMENT_BODY}" | sed -n 's/.*\(^\|[[:space:]]\)acceptance=\([A-Za-z0-9._-][A-Za-z0-9._-]*\).*/\2/p' | head -1)"
          fi
          printf 'acceptance_authorization_id=%s\n' "${AUTH}" >> "${GITHUB_OUTPUT}"
          echo "TEAM_COMMAND_ACCEPTANCE_AUTHORIZATION_ID=${AUTH:-NONE}"

  dispatch:
    if: ${{ false }} # SECURITY_HOLD: team command dispatcher paused pending review
    needs: parse-command
    uses: ./.github/workflows/team-dispatch-authority.yml
    with:
      reason: Issue #122 governed command dispatch via single authority
      acceptance_authorization_id: ${{ needs.parse-command.outputs.acceptance_authorization_id }}
    secrets: inherit
