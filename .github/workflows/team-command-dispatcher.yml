name: HooshyarOS Team Command Dispatcher

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: hooshyaros-team-command-dispatcher
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      ${{ github.event.issue.pull_request == null &&
          github.event.issue.number == 122 &&
          startsWith(github.event.comment.body, '/opencode-team-run') }}
    uses: ./.github/workflows/team-dispatch-authority.yml
    with:
      reason: Issue #122 governed command dispatch via single authority
    secrets: inherit
